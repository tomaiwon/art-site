    prevGray = gray;
    OUT.width = PW; OUT.height = PH;
    octx.fillStyle = LIVE.paperColor; octx.fillRect(0, 0, PW, PH);
    if (LIVE.showSource) { octx.save(); octx.globalAlpha = 0.18; octx.drawImage(work, 0, 0); octx.restore(); }
    octx.drawImage(trail, 0, 0);
  }

  function frame(t) {
    if (!running) return;
    if (vsrc === 'demo') drawDemo(t);
    if (grab()) {
      if (cur === 'kineticTrace') traceInk();
      else {
        OUT.width = PW; OUT.height = PH; octx.drawImage(work, 0, 0);
        try { EFFECTS[cur].apply(octx, octx.getImageData(0, 0, PW, PH), params); } catch (e) {}
      }
    }
    rafId = requestAnimationFrame(frame);
  }
  function startLoop() { if (running) return; running = true; rafId = requestAnimationFrame(frame); }
  function stopLoop() {
    running = false; cancelAnimationFrame(rafId);
    if (camStream) { camStream.getTracks().forEach((tk) => tk.stop()); camStream = null; if (vsrc === 'cam') { vsrc = 'demo'; setSrcActive('demo'); document.getElementById('src-status').textContent = '演示运动源运行中'; sizeVideo(PW, Math.round(PW * 480 / 640)); } }
  }

  // —— 图片渲染 ——
  function renderStill() {
    const s = sourceCanvas, sc = Math.min(1, MAX / Math.max(s.width, s.height));
    const w = Math.round(s.width * sc), h = Math.round(s.height * sc);
    OUT.width = w; OUT.height = h; octx.clearRect(0, 0, w, h); octx.drawImage(s, 0, 0, w, h);
    try { EFFECTS[cur].apply(octx, octx.getImageData(0, 0, w, h), params); } catch (e) {}
  }
  function rerender() { if (mode === 'image') renderStill(); }

  // —— 卡片（LOOKS）——
  const cards = document.getElementById('cards');
  EFFECT_ORDER.forEach((key) => {
    const card = document.createElement('button');
    card.className = 'card' + (key === cur ? ' active' : '');
    const tc = document.createElement('canvas'); tc.className = 'thumb'; tc.width = TW; tc.height = TH;
    const lab = document.createElement('span'); lab.className = 'clab'; lab.textContent = EFFECTS[key].label;
    card.appendChild(tc); card.appendChild(lab);
    card.onclick = () => {
      cur = key; params = { ...EFFECTS[key].defaults };
      [...cards.children].forEach((c) => c.classList.toggle('active', c === card));
      buildControls(); rerender();
    };
    cards.appendChild(card);
  });
  function renderThumbs() {
    [...cards.children].forEach((card, idx) => {
      const key = EFFECT_ORDER[idx]; const tc = card.querySelector('canvas'); const g = tc.getContext('2d', { willReadFrequently: true });
      g.clearRect(0, 0, TW, TH); g.drawImage(sourceCanvas, 0, 0, TW, TH);
      try { EFFECTS[key].apply(g, g.getImageData(0, 0, TW, TH), { ...EFFECTS[key].defaults }); } catch (e) {}
    });
  }

  // —— 控件 ——
  const controls = document.getElementById('controls');
  function buildControls() {
    controls.innerHTML = '';
    const live = isLiveTrace();
    const schema = live ? LIVE_CONTROLS : EFFECTS[cur].controls;
    const pset = live ? LIVE : params;
    if (mode === 'video' && cur === 'kineticTrace') {
      const note = document.createElement('div'); note.className = 'hint-note';
      note.textContent = '实时墨迹：帧间差分 + 反馈拖影。动起来才有墨。'; controls.appendChild(note);
    } else if (mode === 'video') {
      const note = document.createElement('div'); note.className = 'hint-note';
      note.textContent = '此效果逐帧应用到视频/摄像头画面。'; controls.appendChild(note);
    }
    for (const c of schema) {
      const wrap = document.createElement('div');
      if (c.type === 'range') {
        wrap.className = 'ctrl';
        const disp = c.fmt ? c.fmt(pset[c.key]) : pset[c.key];
        wrap.innerHTML = `<div class="lab"><b>${c.label}</b><span data-v>${disp}</span></div>`;
        const inp = document.createElement('input'); inp.type = 'range'; inp.min = c.min; inp.max = c.max; inp.step = c.step; inp.value = pset[c.key];
        inp.oninput = () => { pset[c.key] = +inp.value; wrap.querySelector('[data-v]').textContent = c.fmt ? c.fmt(+inp.value) : inp.value; rerender(); };
        wrap.appendChild(inp);
      } else if (c.type === 'check') {
        const lb = document.createElement('label'); lb.className = 'chk'; lb.textContent = ' ' + c.label;
        const inp = document.createElement('input'); inp.type = 'checkbox'; inp.checked = !!pset[c.key];
        inp.onchange = () => { pset[c.key] = inp.checked; rerender(); };
        lb.prepend(inp); controls.appendChild(lb); continue;
      } else if (c.type === 'color') {
        wrap.className = 'ctrl'; wrap.innerHTML = `<div class="lab"><b>${c.label}</b></div>`;
        const inp = document.createElement('input'); inp.type = 'color'; inp.value = pset[c.key];
        inp.oninput = () => { pset[c.key] = inp.value; rerender(); }; wrap.appendChild(inp);
      } else if (c.type === 'text') {
        wrap.className = 'ctrl'; wrap.innerHTML = `<div class="lab"><b>${c.label}</b></div>`;
        const inp = document.createElement('input'); inp.type = 'text'; inp.value = pset[c.key];
        inp.oninput = () => { pset[c.key] = inp.value; rerender(); }; wrap.appendChild(inp);
      } else if (c.type === 'select') {
        wrap.className = 'ctrl'; wrap.innerHTML = `<div class="lab"><b>${c.label}</b></div>`;
        const sel = document.createElement('select');
        c.options.forEach((o) => { const op = document.createElement('option'); op.value = o; op.textContent = o; sel.appendChild(op); });
        sel.value = pset[c.key]; sel.onchange = () => { pset[c.key] = sel.value; rerender(); }; wrap.appendChild(sel);
      }
      controls.appendChild(wrap);
    }
  }

  // —— 图片拖放 ——
  const drop = document.getElementById('img-drop');
  function loadImage(file) {
    const img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight; c.getContext('2d').drawImage(img, 0, 0); sourceCanvas = c; drop.textContent = `已加载：${file.name}（点击可换图）`; renderStill(); renderThumbs(); };
    img.src = URL.createObjectURL(file);
  }
  drop.onclick = () => { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.onchange = (e) => e.target.files[0] && loadImage(e.target.files[0]); i.click(); };
  drop.ondragover = (e) => { e.preventDefault(); drop.style.background = '#ffff00'; };
  drop.ondragleave = () => { drop.style.background = ''; };
  drop.ondrop = (e) => { e.preventDefault(); drop.style.background = ''; e.dataTransfer.files[0] && loadImage(e.dataTransfer.files[0]); };

  // —— 视频来源切换 ——
  const status = document.getElementById('src-status');
  function setSrcActive(k) { document.getElementById('src-demo').classList.toggle('active', k === 'demo'); document.getElementById('src-cam').classList.toggle('active', k === 'cam'); document.getElementById('src-file').classList.toggle('active', k === 'file'); }
  function setSource(k) {
    vsrc = k; setSrcActive(k);
    if (k !== 'cam' && camStream) { camStream.getTracks().forEach((t) => t.stop()); camStream = null; }
    prevGray = null;
    if (k === 'demo') { sizeVideo(PW, Math.round(PW * 480 / 640)); status.textContent = '演示运动源运行中'; }
    else if (k === 'cam') {
      status.textContent = '正在请求摄像头…';
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { status.textContent = '此环境不支持摄像头，已回退到演示源'; setSource('demo'); return; }
      navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
        .then((s) => { camStream = s; video.srcObject = s; video.play(); video.onloadedmetadata = () => sizeVideo(PW, Math.round(PW * video.videoHeight / video.videoWidth)); status.textContent = '摄像头运行中（在镜头前动一动）'; })
        .catch((e) => { status.textContent = '摄像头不可用（' + e.name + '），已回退到演示源'; setSource('demo'); });
    } else if (k === 'file') { document.getElementById('src-fileInput').click(); }
  }
  document.getElementById('src-demo').onclick = () => setSource('demo');
  document.getElementById('src-cam').onclick = () => setSource('cam');
  document.getElementById('src-file').onclick = () => setSource('file');
  document.getElementById('src-fileInput').onchange = (e) => {
    const f = e.target.files[0]; if (!f) return; video.srcObject = null; video.src = URL.createObjectURL(f); video.play();
    video.onloadedmetadata = () => sizeVideo(PW, Math.round(PW * video.videoHeight / video.videoWidth));
    vsrc = 'file'; prevGray = null; setSrcActive('file'); status.textContent = '播放上传视频：' + f.name;
  };

  // —— 模式切换 ——
  const bImg = document.getElementById('mode-image'), bVid = document.getElementById('mode-video');
  function show(m) {
    mode = m;
    bImg.classList.toggle('active', m === 'image'); bVid.classList.toggle('active', m === 'video');
    document.getElementById('srcbar').classList.toggle('hidden', m !== 'video');
    document.getElementById('img-drop').classList.toggle('hidden', m === 'video');
    document.getElementById('stage-cap').textContent = m === 'video'
      ? '任选下方效果逐帧应用到视频/摄像头；选 “Trace Motion” 即实时运动墨迹。'
      : '56 种效果，选下方卡片切换。真实照片效果最佳。';
    buildControls();
    if (m === 'video') startLoop(); else { stopLoop(); renderStill(); }
  }
  bImg.onclick = () => show('image');
  bVid.onclick = () => show('video');

  // —— 按钮 ——
  document.getElementById('btn-reset').onclick = () => {
    if (isLiveTrace()) { Object.assign(LIVE, { sensitivity: 60, trail: 70, feedbackZoom: 1.01, feedbackSpin: 0, gain: 1.6, dither: true, prismatic: false, showSource: false, mirror: true, inkColor: '#1d4ed8', paperColor: '#f4f2ea' }); tctx.fillStyle = LIVE.paperColor; tctx.fillRect(0, 0, PW, PH); }
    else params = { ...EFFECTS[cur].defaults };
    buildControls(); rerender();
  };
  document.getElementById('btn-save').onclick = () => { const a = document.createElement('a'); a.download = cur + '.png'; a.href = OUT.toDataURL(); a.click(); };

  // —— 启动 ——
  buildControls(); renderStill(); renderThumbs();
})();
</script>
</body>
</html>
