  *{box-sizing:border-box;margin:0;padding:0;}

  .mob-nav a{

    font-weight:700;

    text-transform:uppercase;
    color:#aaa;
    text-decoration:none;
  }
  .mob-nav a.active{ color:#111; }
  .mob-nav a:hover{ color:#111; }

  .top-nav{

    color:#111;
    border-bottom:1px solid #e8e8e8;

  .film-card img{
    display:block;
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
  }
  .film-info{
    padding:16px 20px 20px;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .film-year{
    font-family:"ZFont","EFont",sans-serif;

    font-weight:700;
    letter-spacing:0.8px;

  .film-title-zh{
