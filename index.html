<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════════════
// GLOBALS
// ═══════════════════════════════════════════════════════════════════════════════
let W = window.innerWidth, H = window.innerHeight;
const DPR = Math.min(2, devicePixelRatio || 1);

// ═══════════════════════════════════════════════════════════════════════════════
// THREE.JS SCENE
// ═══════════════════════════════════════════════════════════════════════════════
const threeCanvas = document.getElementById('three-canvas');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xede9e3);

const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 200);
camera.position.set(0, 0.5, 20);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true });
renderer.setPixelRatio(DPR);
renderer.setSize(W, H);

// Lighting — directional to show cloth folds
scene.add(new THREE.AmbientLight(0xfff8f0, 0.65));
const dirL = new THREE.DirectionalLight(0xffffff, 0.9);
dirL.position.set(4, 6, 12); scene.add(dirL);
const fillL = new THREE.DirectionalLight(0xffe8d0, 0.35);
fillL.position.set(-6, -2, -8); scene.add(fillL);

// ═══════════════════════════════════════════════════════════════════════════════
// CLOTH TEXTURE
// ═══════════════════════════════════════════════════════════════════════════════
const TEX_W = 1024, TEX_H = 768;
const texCanvas = document.createElement('canvas');
texCanvas.width = TEX_W; texCanvas.height = TEX_H;
const tc = texCanvas.getContext('2d');

function drawTexture() {
  tc.fillStyle = '#f7f3ee';
  tc.fillRect(0, 0, TEX_W, TEX_H);

  // Subtle weave grain
  tc.save();
  tc.globalAlpha = 0.03;
  tc.strokeStyle = '#333';
  tc.lineWidth = 0.5;
  for (let x = 0; x < TEX_W; x += 7) { tc.beginPath(); tc.moveTo(x,0); tc.lineTo(x,TEX_H); tc.stroke(); }
  for (let y = 0; y < TEX_H; y += 7) { tc.beginPath(); tc.moveTo(0,y); tc.lineTo(TEX_W,y); tc.stroke(); }
  tc.restore();

  tc.textAlign = 'center';
  tc.fillStyle = '#111';

  tc.font = 'bold 38px EFont, sans-serif';
  tc.fillText('ABOUT', TEX_W / 2, 148);

  tc.font = 'bold 24px ZFont, sans-serif';
  ['黄熠，二零零二年生。',
   '栖居长沙、往来伦敦。',
   '为研究型文艺工作者。',
   '其作多由数字之世、艺史之脉',
   '与地缘之局而生。以影像、装置、文本为媒。'
  ].forEach((l,i) => tc.fillText(l, TEX_W/2, 216 + i*40));

  tc.font = '600 19px EFont, sans-serif';
  tc.fillStyle = '#2a2a2a';
  ['Yi Huang (b. 2OO2) is a research-based artistic worker,',
   'based between Changsha and London. His practice',
   'examines the digital age, art history, and geopolitics',
   'through moving image, installation, and text.'
  ].forEach((l,i) => tc.fillText(l, TEX_W/2, 444 + i*30));

  tc.font = '600 17px EFont, sans-serif';
  tc.fillStyle = '#555';
  tc.textAlign = 'left';
  const eX = 142;
  tc.fillText('2O2O\u20132O24', eX, 572);
  tc.fillText("Xi'an Academy of Fine Arts  \u2014  BA Digital Media Art", eX+148, 572);
  tc.fillText('2O25\u20132O26', eX, 603);
  tc.fillText('Royal College of Art  \u2014  MA Contemporary Art Practice', eX+148, 603);

  tc.textAlign = 'center';
  tc.font = '600 13px EFont, sans-serif';
  tc.fillStyle = '#999';
  tc.fillText('yihuang.art', TEX_W/2, 688);
}

drawTexture();
const clothTexture = new THREE.CanvasTexture(texCanvas);
document.fonts.ready.then(() => { drawTexture(); clothTexture.needsUpdate = true; });

// ═══════════════════════════════════════════════════════════════════════════════
// CLOTH PHYSICS — Verlet + PBD
// ═══════════════════════════════════════════════════════════════════════════════
const SEGS_X = 26, SEGS_Y = 18;
const NX = SEGS_X + 1, NY = SEGS_Y + 1;
const N = NX * NY;
const CW = 22, CH = 14;

const px = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N);
const ox = new Float32Array(N), oy = new Float32Array(N), oz = new Float32Array(N);
const pinned = new Uint8Array(N);

for (let j = 0; j < NY; j++) {
  for (let i = 0; i < NX; i++) {
    const k = j * NX + i;
    const nj = j / SEGS_Y;
    px[k] = -CW/2 + i * (CW/SEGS_X);
    py[k] = CH/2 - j * (CH/SEGS_Y);
    pz[k] = nj*(1-nj)*0.5 + (Math.random()-0.5)*0.04;
    ox[k] = px[k]; oy[k] = py[k]; oz[k] = pz[k];
    if (j === 0) pinned[k] = 1;
  }
}

const constraints = [], restLen = [];
function addC(a, b) {
  const dx=px[a]-px[b], dy=py[a]-py[b], dz=pz[a]-pz[b];
  restLen.push(Math.sqrt(dx*dx+dy*dy+dz*dz));
  constraints.push(a, b);
}
for (let j = 0; j < NY; j++) {
  for (let i = 0; i < NX; i++) {
    const k = j*NX+i;
    if (i < SEGS_X) addC(k, k+1);
    if (j < SEGS_Y) addC(k, k+NX);
    if (i < SEGS_X && j < SEGS_Y) { addC(k, k+NX+1); addC(k+1, k+NX); }
    if (i < SEGS_X-1) addC(k, k+2);
    if (j < SEGS_Y-1) addC(k, k+NX*2);
  }
}

const GRAVITY = -9.0, DAMPING = 0.992, ITER = 10, DT = 1/60;
let simTime = 0;

// Mouse NDC
const mouseNDC = new THREE.Vector2(0, 0);
let mouseActive = false;
const _mWorld = new THREE.Vector3();
const _mRay = new THREE.Raycaster();
const _mPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

window.addEventListener('mousemove', e => {
  mouseNDC.set((e.clientX/W)*2-1, -(e.clientY/H)*2+1);
  mouseActive = true;
});
window.addEventListener('mouseleave', () => { mouseActive = false; });
window.addEventListener('touchmove', e => {
  const t = e.touches[0];
  mouseNDC.set((t.clientX/W)*2-1, -(t.clientY/H)*2+1);
  mouseActive = true;
}, { passive: true });

function updateCloth() {
  simTime += DT;

  // Animate pinned top edge — slow sway
  for (let i = 0; i < NX; i++) {
    const ni = i / SEGS_X;
    px[i] = -CW/2 + i*(CW/SEGS_X) + Math.sin(simTime*0.38 + ni*3.1)*0.10;
    py[i] = CH/2 + Math.cos(simTime*0.24 + ni*2.0)*0.06;
    pz[i] = Math.sin(simTime*0.32 + ni*2.4)*0.20;
    ox[i] = px[i]; oy[i] = py[i]; oz[i] = pz[i];
  }

  // Mouse world position on z=0 plane
  if (mouseActive) {
    _mRay.setFromCamera(mouseNDC, camera);
    _mRay.ray.intersectPlane(_mPlane, _mWorld);
  }

  for (let k = 0; k < N; k++) {
    if (pinned[k]) continue;
    const vx=(px[k]-ox[k])*DAMPING, vy=(py[k]-oy[k])*DAMPING, vz=(pz[k]-oz[k])*DAMPING;
    ox[k]=px[k]; oy[k]=py[k]; oz[k]=pz[k];

    let ax=0, ay=GRAVITY*DT*DT, az=0;
    ax += Math.sin(simTime*0.28 + py[k]*0.6) * 0.004;
    az += Math.cos(simTime*0.22 + px[k]*0.5) * 0.006;

    if (mouseActive) {
      const dx=px[k]-_mWorld.x, dy=py[k]-_mWorld.y, dz=pz[k]-_mWorld.z;
      const d2=dx*dx+dy*dy+dz*dz, R=2.8;
      if (d2 < R*R) {
        const d=Math.sqrt(d2)+1e-6, f=(1-d/R)*0.22;
        ax+=(dx/d)*f; ay+=(dy/d)*f; az+=(dz/d)*f + f*0.6;
      }
    }

    px[k]+=vx+ax; py[k]+=vy+ay; pz[k]+=vz+az;
  }

  for (let iter = 0; iter < ITER; iter++) {
    for (let c=0, ci=0; c<constraints.length; c+=2, ci++) {
      const a=constraints[c], b=constraints[c+1];
      const dx=px[b]-px[a], dy=py[b]-py[a], dz=pz[b]-pz[a];
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz)+1e-9;
      const corr=(d-restLen[ci])/d*0.5;
      const cx=dx*corr, cy=dy*corr, cz=dz*corr;
      if (!pinned[a]) { px[a]+=cx; py[a]+=cy; pz[a]+=cz; }
      if (!pinned[b]) { px[b]-=cx; py[b]-=cy; pz[b]-=cz; }
    }
  }
}

// ─── Cloth mesh ────────────────────────────────────────────────────────────────
const geo = new THREE.PlaneGeometry(CW, CH, SEGS_X, SEGS_Y);
geo.attributes.position.setUsage(THREE.DynamicDrawUsage);
const mat = new THREE.MeshStandardMaterial({ map: clothTexture, side: THREE.DoubleSide, roughness: 0.88, metalness: 0 });
const clothMesh = new THREE.Mesh(geo, mat);
scene.add(clothMesh);

function syncGeo() {
  const pos = geo.attributes.position;
  for (let k = 0; k < N; k++) pos.setXYZ(k, px[k], py[k], pz[k]);
  pos.needsUpdate = true;
  geo.computeVertexNormals();
}

// ═══════════════════════════════════════════════════════════════════════════════
// UV ↔ CLOTH HELPERS
// canvas-space UV: u=0 left, u=1 right, v=0 TOP, v=1 bottom
// (= 1 - three.js uv.y)
// ═══════════════════════════════════════════════════════════════════════════════

// Bilinear interpolation: UV → world position on cloth surface
function uvToWorld(u, v, out) {
  const fi = Math.max(0, Math.min(SEGS_X-1+0.9999, u * SEGS_X));
  const fj = Math.max(0, Math.min(SEGS_Y-1+0.9999, v * SEGS_Y));
  const i0 = Math.floor(fi)|0, j0 = Math.floor(fj)|0;
  const i1 = Math.min(i0+1, SEGS_X), j1 = Math.min(j0+1, SEGS_Y);
  const tu = fi-i0, tv = fj-j0;
  const a=j0*NX+i0, b=j0*NX+i1, c=j1*NX+i0, d=j1*NX+i1;
  const w00=(1-tu)*(1-tv), w10=tu*(1-tv), w01=(1-tu)*tv, w11=tu*tv;
  out.x = px[a]*w00+px[b]*w10+px[c]*w01+px[d]*w11;
  out.y = py[a]*w00+py[b]*w10+py[c]*w01+py[d]*w11;
  out.z = pz[a]*w00+pz[b]*w10+pz[c]*w01+pz[d]*w11;
}

// Cloth normal at UV (for fly-off direction)
function uvToNormal(u, v, out) {
  const i0 = Math.max(0, Math.min(SEGS_X-1, Math.floor(u*SEGS_X)));
  const j0 = Math.max(0, Math.min(SEGS_Y-1, Math.floor(v*SEGS_Y)));
  const i1 = Math.min(i0+1, SEGS_X), j1 = Math.min(j0+1, SEGS_Y);
  const a=j0*NX+i0, b=j0*NX+i1, c=j1*NX+i0;
  const eux=px[b]-px[a], euy=py[b]-py[a], euz=pz[b]-pz[a];
  const evx=px[c]-px[a], evy=py[c]-py[a], evz=pz[c]-pz[a];
  const nx=euy*evz-euz*evy, ny=euz*evx-eux*evz, nz=eux*evy-euy*evx;
  const len=Math.sqrt(nx*nx+ny*ny+nz*nz)+1e-6;
  out.x=nx/len; out.y=ny/len; out.z=nz/len;
}

// Project world → screen (returns false if behind camera)
const _pv = new THREE.Vector3();
function project(wx, wy, wz, out) {
  _pv.set(wx, wy, wz);
  _pv.project(camera);
  if (_pv.z > 1.0) { out.ok = false; return; }
  out.x = (_pv.x+1)*0.5*W;
  out.y = (-_pv.y+1)*0.5*H;
  out.ok = true;
}
const _proj = { x:0, y:0, ok:true };

// ═══════════════════════════════════════════════════════════════════════════════
// 2D PARTICLE CANVAS — surface-crawling flow field
// ═══════════════════════════════════════════════════════════════════════════════
const pCanvas = document.getElementById('pcanvas');
const ctx = pCanvas.getContext('2d', { alpha: true });

function resizeP() {
  pCanvas.width  = Math.floor(W * DPR);
  pCanvas.height = Math.floor(H * DPR);
  pCanvas.style.width  = W + 'px';
  pCanvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resizeP();

// ─── Noise (same hash as original) ────────────────────────────────────────────
function hash(n) { return (Math.sin(n) * 43758.5453123) % 1; }
function noise(x, y) {
  const xi=Math.floor(x), yi=Math.floor(y);
  const xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const n00=hash(xi+yi*57), n10=hash(xi+1+yi*57);
  const n01=hash(xi+(yi+1)*57), n11=hash(xi+1+(yi+1)*57);
  return (n00*(1-u)+n10*u)*(1-v)+(n01*(1-u)+n11*u)*v;
}

// ─── UV flow field (warp/weft/fold/detail — same logic as original) ───────────
// UV coords: canvas-space, v=0=top, v=1=bottom (matches original y direction)
const UV_STEP = 0.0011; // UV distance per substep

function uvField(u, v, t) {
  // Map to [-1,1] like original (nu,nv match nx,ny semantics)
  const nu = u*2-1, nv = v*2-1;

  const warpPhase = nu*3.2 + t*0.22;
  let fu = 0.20 * Math.sin(warpPhase + nv*2.0);
  let fv = 0.70 + 0.12 * Math.cos(warpPhase*0.65 + t*0.18);

  const weftPhase = nv*4.5 + t*0.16;
  fu += 0.13 * Math.cos(weftPhase + nu*1.9);
  fv += 0.06 * Math.sin(weftPhase*0.85);

  const foldN = noise(nu*1.4 + t*0.08, nv*1.1 + t*0.06);
  const foldA = foldN * Math.PI * 2.4;
  fu += 0.22 * Math.cos(foldA);
  fv += 0.14 * Math.sin(foldA);

  fu += (noise(nu*8.0 + t*0.25, nv*8.0) - 0.5) * 0.07;
  fv += (noise(nu*6.0, nv*6.5 + t*0.20) - 0.5) * 0.05;

  const len = Math.hypot(fu, fv) + 1e-6;
  return { du: fu/len * UV_STEP, dv: fv/len * UV_STEP };
}

// ─── Text regions in canvas-space UV ──────────────────────────────────────────
// (same definition used for particle raycast proximity and Three.js texture)
const textRegions = [
  { u:0.50, v:0.193, uw:0.22, vh:0.05 },   // ABOUT    (y≈148/768)
  { u:0.50, v:0.390, uw:0.80, vh:0.26 },   // Chinese bio
  { u:0.50, v:0.635, uw:0.78, vh:0.17 },   // English bio
  { u:0.50, v:0.775, uw:0.82, vh:0.08 },   // Education
];
function inText(cu, cv) {
  for (const r of textRegions)
    if (Math.abs(cu-r.u) < r.uw*0.5 && Math.abs(cv-r.v) < r.vh*0.5) return true;
  return false;
}

// ─── Surface particles ─────────────────────────────────────────────────────────
const SURF_COUNT = 950;
const SUBSTEPS    = 8;   // substeps per frame (draws a multi-segment path)
const FADE        = 0.052;

const _wt = { x:0, y:0, z:0 }; // reusable world temp
const _nt = { x:0, y:0, z:0 }; // reusable normal temp

// Particle has two modes:
//   'crawl' — UV-space, rides cloth surface
//   'fly'   — world-space physics, floating off cloth
const surf = Array.from({ length: SURF_COUNT }, () => ({
  // crawl state
  u: Math.random(), v: Math.random(),
  sx: -1e5, sy: -1e5,           // last screen position
  life: 0, maxLife: 1,
  // fly state
  mode: 'crawl',
  wx: 0, wy: 0, wz: 0,
  vx: 0, vy: 0, vz: 0,
  flyLife: 0, maxFlyLife: 1,
}));

function initParticle(p) {
  if (Math.random() < 0.55) {
    p.u = Math.random();
    p.v = Math.random() * 0.12;       // spawn near top → flows downward
  } else {
    p.u = Math.random();
    p.v = Math.random();
  }
  p.life = (Math.random() * 180) | 0; // stagger phase
  p.maxLife = (200 + Math.random() * 220) | 0;
  p.mode = 'crawl';
  // init screen pos
  uvToWorld(p.u, p.v, _wt);
  project(_wt.x, _wt.y, _wt.z, _proj);
  p.sx = _proj.x; p.sy = _proj.y;
}

surf.forEach(initParticle);

// Mouse UV (canvas-space) from raycast
const _hitRay = new THREE.Raycaster();
let mouseUV = null, mouseOnText = false;

function updateMouseUV() {
  mouseUV = null; mouseOnText = false;
  if (!mouseActive) return;
  _hitRay.setFromCamera(mouseNDC, camera);
  const hits = _hitRay.intersectObject(clothMesh);
  if (hits.length > 0 && hits[0].uv) {
    const cu = hits[0].uv.x;
    const cv = 1 - hits[0].uv.y;   // three.js → canvas-space
    mouseUV = { u: cu, v: cv };
    mouseOnText = inText(cu, cv);
  }
}

function tickParticles(t) {
  // ── 1. Fade previous frame's trails ──────────────────────────────────────────
  ctx.fillStyle = `rgba(237,233,227,${FADE})`;
  ctx.fillRect(0, 0, W, H);

  // ── 2. Update mouse UV ───────────────────────────────────────────────────────
  updateMouseUV();

  // ── 3. Update & draw each particle ──────────────────────────────────────────
  ctx.lineWidth = 0.85;
  ctx.strokeStyle = 'rgba(0,0,0,0.17)';

  for (let i = 0; i < SURF_COUNT; i++) {
    const p = surf[i];

    // ── FLY MODE ──────────────────────────────────────────────────────────────
    if (p.mode === 'fly') {
      p.wx += p.vx; p.wy += p.vy; p.wz += p.vz;
      p.vx *= 0.965; p.vy *= 0.965; p.vz *= 0.965;
      p.vy -= 0.0025;
      p.flyLife--;

      if (p.flyLife <= 0) { initParticle(p); continue; }

      project(p.wx, p.wy, p.wz, _proj);
      if (!_proj.ok) { initParticle(p); continue; }

      const ta = (p.flyLife / p.maxFlyLife);
      ctx.beginPath();
      ctx.arc(_proj.x, _proj.y, 1.8, 0, Math.PI*2);
      ctx.fillStyle = `rgba(0,0,0,${(ta*ta*0.55).toFixed(3)})`;
      ctx.fill();
      continue;
    }

    // ── CRAWL MODE ────────────────────────────────────────────────────────────
    p.life++;
    if (p.life > p.maxLife) { initParticle(p); continue; }

    // Check if mouse is close enough to trigger fly-off
    if (mouseOnText && mouseUV) {
      const du = p.u - mouseUV.u, dv = p.v - mouseUV.v;
      if (du*du + dv*dv < 0.048*0.048) {
        uvToWorld(p.u, p.v, _wt);
        uvToNormal(p.u, p.v, _nt);
        p.mode = 'fly';
        p.wx = _wt.x; p.wy = _wt.y; p.wz = _wt.z;
        const spd = 0.06 + Math.random()*0.08;
        const jit = 0.025;
        p.vx = _nt.x*spd + (Math.random()-0.5)*jit;
        p.vy = _nt.y*spd + (Math.random()-0.5)*jit + 0.012;
        p.vz = _nt.z*spd + (Math.random()-0.5)*jit;
        p.maxFlyLife = (45 + Math.random()*55) | 0;
        p.flyLife = p.maxFlyLife;
        continue;
      }
    }

    // Step through UV field, draw projected path
    ctx.beginPath();
    ctx.moveTo(p.sx, p.sy);

    let died = false;
    for (let s = 0; s < SUBSTEPS; s++) {
      const f = uvField(p.u, p.v, t);
      p.u += f.du;
      p.v += f.dv;

      if (p.u < 0 || p.u > 1 || p.v < 0 || p.v > 1) { died = true; break; }

      uvToWorld(p.u, p.v, _wt);
      project(_wt.x, _wt.y, _wt.z, _proj);
      if (!_proj.ok) { died = true; break; }

      ctx.lineTo(_proj.x, _proj.y);
    }

    ctx.stroke();

    if (died) { initParticle(p); }
    else       { p.sx = _proj.x; p.sy = _proj.y; }
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// RESIZE
// ═══════════════════════════════════════════════════════════════════════════════
window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = W/H; camera.updateProjectionMatrix();
  renderer.setSize(W, H);
  resizeP();
  // re-init screen positions after resize
  surf.forEach(p => {
    if (p.mode === 'crawl') {
      uvToWorld(p.u, p.v, _wt);
      project(_wt.x, _wt.y, _wt.z, _proj);
      p.sx = _proj.x; p.sy = _proj.y;
    }
  });
});

// ═══════════════════════════════════════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════════════════════
function animate(now) {
  requestAnimationFrame(animate);
  const t = now * 0.001;
  updateCloth();
  syncGeo();
  tickParticles(t);
  renderer.render(scene, camera);
}

// Init particle canvas background
ctx.fillStyle = 'rgba(237,233,227,1)';
ctx.fillRect(0, 0, W, H);

requestAnimationFrame(animate);
</script>
</body>
</html>
