<style>
  @font-face{font-family:"EFont";src:url("fonts/E.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:"EFont";src:url("fonts/E.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:"ZFont";src:url("fonts/Z-index.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block;}
  @font-face{font-family:"ZFont";src:url("fonts/Z-index.woff2") format("woff2");font-weight:700;font-style:normal;font-display:block;}

<body>

<canvas id="three-canvas"></canvas>

<nav class="top-nav" aria-label="Primary">
  <a href="work.html">WORK</a>
  <a href="contact.html">CONTACT</a>
  <a href="news.html">AUTOMATIC</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
// ─── Scene ─────────────────────────────────────────────────────────────────────
const threeCanvas = document.getElementById('three-canvas');
let W = window.innerWidth, H = window.innerHeight;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xede9e3);

const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 200);
camera.position.set(0, 0.5, 20);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(W, H);

// Lights — give the cloth folded-fabric shading
const ambLight = new THREE.AmbientLight(0xfff8f0, 0.65);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(4, 6, 12);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xffe8d0, 0.35);
fillLight.position.set(-6, -2, -8);
scene.add(fillLight);

// ─── Cloth Texture (canvas) ────────────────────────────────────────────────────
const TEX_W = 1024, TEX_H = 768;
const texCanvas = document.createElement('canvas');
texCanvas.width = TEX_W; texCanvas.height = TEX_H;
const tc = texCanvas.getContext('2d');

function drawTexture() {
  // Fabric base
  tc.fillStyle = '#f7f3ee';
  tc.fillRect(0, 0, TEX_W, TEX_H);

  // Subtle weave grain — very faint crosshatch
  tc.save();
  tc.globalAlpha = 0.028;
  tc.strokeStyle = '#222';
  tc.lineWidth = 0.6;
  for (let x = 0; x < TEX_W; x += 7) {
    tc.beginPath(); tc.moveTo(x, 0); tc.lineTo(x, TEX_H); tc.stroke();
  }
  for (let y = 0; y < TEX_H; y += 7) {
    tc.beginPath(); tc.moveTo(0, y); tc.lineTo(TEX_W, y); tc.stroke();
  }
  tc.restore();

  // ── ABOUT ──
  tc.fillStyle = '#111';
  tc.textAlign = 'center';
  tc.font = 'bold 38px EFont, sans-serif';
  tc.fillText('ABOUT', TEX_W / 2, 148);

  // ── Chinese bio ──
  tc.font = 'bold 24px ZFont, sans-serif';
  tc.fillStyle = '#111';
  const zhLines = [
    '黄熠，二零零二年生。',
    '栖居长沙、往来伦敦。',
    '为研究型文艺工作者。',
    '其作多由数字之世、艺史之脉',
    '与地缘之局而生。以影像、装置、文本为媒。'
  ];
  zhLines.forEach((l, i) => tc.fillText(l, TEX_W / 2, 218 + i * 40));

  // ── English bio ──
  tc.font = '600 19px EFont, sans-serif';
  tc.fillStyle = '#2a2a2a';
  const enLines = [
    'Yi Huang (b. 2OO2) is a research-based artistic worker,',
    'based between Changsha and London. His practice',
    'examines the digital age, art history, and geopolitics',
    'through moving image, installation, and text.'
  ];
  enLines.forEach((l, i) => tc.fillText(l, TEX_W / 2, 446 + i * 30));

  // ── Education ──
  tc.font = '600 17px EFont, sans-serif';
  tc.fillStyle = '#555';
  tc.textAlign = 'left';
  const eX = 142;
  tc.fillText('2O2O\u20132O24', eX, 574);
  tc.fillText("Xi'an Academy of Fine Arts  \u2014  BA Digital Media Art", eX + 148, 574);
  tc.fillText('2O25\u20132O26', eX, 605);
  tc.fillText('Royal College of Art  \u2014  MA Contemporary Art Practice', eX + 148, 605);

  // ── Footer ──
  tc.textAlign = 'center';
  tc.font = '600 13px EFont, sans-serif';
  tc.fillStyle = '#999';
  tc.fillText('yihuang.art', TEX_W / 2, 690);
}

drawTexture();
const clothTexture = new THREE.CanvasTexture(texCanvas);

// Redraw with custom fonts once loaded
document.fonts.ready.then(() => {
  drawTexture();
  clothTexture.needsUpdate = true;
});

// ─── Cloth Physics (Verlet + PBD constraints) ──────────────────────────────────
const SEGS_X = 26, SEGS_Y = 18;
const NX = SEGS_X + 1, NY = SEGS_Y + 1;
const N = NX * NY;

// Cloth world size — larger than viewport so it fills screen
const CW = 22, CH = 14;

const px = new Float32Array(N);
const py = new Float32Array(N);
const pz = new Float32Array(N);
const ox = new Float32Array(N); // previous positions
const oy = new Float32Array(N);
const oz = new Float32Array(N);
const pinned = new Uint8Array(N);

// Initial positions: flat with slight Z sag
for (let j = 0; j < NY; j++) {
  for (let i = 0; i < NX; i++) {
    const k = j * NX + i;
    const nj = j / SEGS_Y;
    px[k] = -CW / 2 + i * (CW / SEGS_X);
    py[k] = CH / 2 - j * (CH / SEGS_Y);
    pz[k] = nj * (1 - nj) * 0.5 + (Math.random() - 0.5) * 0.04;
    ox[k] = px[k]; oy[k] = py[k]; oz[k] = pz[k];
    if (j === 0) pinned[k] = 1;
  }
}

// Build constraints
const constraints = [];
const restLen = [];

function addC(a, b) {
  const dx = px[a] - px[b], dy = py[a] - py[b], dz = pz[a] - pz[b];
  restLen.push(Math.sqrt(dx * dx + dy * dy + dz * dz));
  constraints.push(a, b);
}

for (let j = 0; j < NY; j++) {
  for (let i = 0; i < NX; i++) {
    const k = j * NX + i;
    if (i < SEGS_X) addC(k, k + 1);
    if (j < SEGS_Y) addC(k, k + NX);
    if (i < SEGS_X && j < SEGS_Y) { addC(k, k + NX + 1); addC(k + 1, k + NX); }
    if (i < SEGS_X - 1) addC(k, k + 2);
    if (j < SEGS_Y - 1) addC(k, k + NX * 2);
  }
}

const GRAVITY = -9.0;
const DAMPING = 0.992;
const ITER = 10;
const DT = 1 / 60;

let simTime = 0;

// Mouse world position (projected onto z=0 plane)
const mouseNDC = new THREE.Vector2(0, 0);
let mouseActive = false;
const raycast = new THREE.Raycaster();
const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const mouseWorld = new THREE.Vector3();

window.addEventListener('mousemove', e => {
  mouseNDC.set((e.clientX / W) * 2 - 1, -(e.clientY / H) * 2 + 1);
  mouseActive = true;
});
window.addEventListener('mouseleave', () => { mouseActive = false; });
window.addEventListener('touchmove', e => {
  const t = e.touches[0];
  mouseNDC.set((t.clientX / W) * 2 - 1, -(t.clientY / H) * 2 + 1);
  mouseActive = true;
}, { passive: true });

function updateCloth() {
  simTime += DT;

  // Animate pinned top row — slow wave to create hanging sway
  for (let i = 0; i < NX; i++) {
    const ni = i / SEGS_X;
    px[i] = -CW / 2 + i * (CW / SEGS_X) + Math.sin(simTime * 0.38 + ni * 3.1) * 0.10;
    py[i] = CH / 2 + Math.cos(simTime * 0.24 + ni * 2.0) * 0.06;
    pz[i] = Math.sin(simTime * 0.32 + ni * 2.4) * 0.20;
    ox[i] = px[i]; oy[i] = py[i]; oz[i] = pz[i];
  }

  // Mouse world pos
  if (mouseActive) {
    raycast.setFromCamera(mouseNDC, camera);
    raycast.ray.intersectPlane(planeZ, mouseWorld);
  }

  // Verlet integrate
  for (let k = 0; k < N; k++) {
    if (pinned[k]) continue;
    const vx = (px[k] - ox[k]) * DAMPING;
    const vy = (py[k] - oy[k]) * DAMPING;
    const vz = (pz[k] - oz[k]) * DAMPING;

    ox[k] = px[k]; oy[k] = py[k]; oz[k] = pz[k];

    // Gravity + gentle turbulence
    let ax = 0;
    let ay = GRAVITY * DT * DT;
    let az = 0;
    ax += Math.sin(simTime * 0.28 + py[k] * 0.6) * 0.004;
    az += Math.cos(simTime * 0.22 + px[k] * 0.5) * 0.006;

    // Mouse push (repulsion)
    if (mouseActive) {
      const dx = px[k] - mouseWorld.x;
      const dy = py[k] - mouseWorld.y;
      const dz = pz[k] - mouseWorld.z;
      const d2 = dx * dx + dy * dy + dz * dz;
      const R = 2.8;
      if (d2 < R * R) {
        const d = Math.sqrt(d2) + 1e-6;
        const f = (1 - d / R) * 0.22;
        ax += (dx / d) * f;
        ay += (dy / d) * f;
        az += (dz / d) * f + f * 0.6;
      }
    }

    px[k] += vx + ax;
    py[k] += vy + ay;
    pz[k] += vz + az;
  }

  // Constraint projection (PBD)
  for (let iter = 0; iter < ITER; iter++) {
    for (let c = 0, ci = 0; c < constraints.length; c += 2, ci++) {
      const a = constraints[c], b = constraints[c + 1];
      const dx = px[b] - px[a];
      const dy = py[b] - py[a];
      const dz = pz[b] - pz[a];
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz) + 1e-9;
      const corr = (d - restLen[ci]) / d * 0.5;
      const cx = dx * corr, cy = dy * corr, cz = dz * corr;
      if (!pinned[a]) { px[a] += cx; py[a] += cy; pz[a] += cz; }
      if (!pinned[b]) { px[b] -= cx; py[b] -= cy; pz[b] -= cz; }
    }
  }
}

// ─── Cloth Mesh ────────────────────────────────────────────────────────────────
const geo = new THREE.PlaneGeometry(CW, CH, SEGS_X, SEGS_Y);
geo.attributes.position.setUsage(THREE.DynamicDrawUsage);

const mat = new THREE.MeshStandardMaterial({
  map: clothTexture,
  side: THREE.DoubleSide,
  roughness: 0.88,
  metalness: 0.0,
});

const clothMesh = new THREE.Mesh(geo, mat);
scene.add(clothMesh);

function syncGeometry() {
  const pos = geo.attributes.position;
  for (let k = 0; k < N; k++) pos.setXYZ(k, px[k], py[k], pz[k]);
  pos.needsUpdate = true;
  geo.computeVertexNormals();
}

// ─── Particle System (Three.js Points, hover near text) ───────────────────────
const MAX_P = 900;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(MAX_P * 3);
const pAlpha = new Float32Array(MAX_P);

pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute('alpha', new THREE.BufferAttribute(pAlpha, 1).setUsage(THREE.DynamicDrawUsage));

const pMat = new THREE.ShaderMaterial({
  vertexShader: `
    attribute float alpha;
    varying float vAlpha;
    void main(){
      vAlpha = alpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = clamp(160.0 / -mv.z, 2.0, 5.0);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      float d = length(gl_PointCoord - vec2(0.5));
      if(d > 0.5) discard;
      float a = vAlpha * smoothstep(0.5, 0.1, d);
      gl_FragColor = vec4(0.08, 0.06, 0.04, a);
    }
  `,
  transparent: true,
  depthWrite: false,
});

const pSystem = new THREE.Points(pGeo, pMat);
scene.add(pSystem);

const parts = Array.from({ length: MAX_P }, () => ({
  x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, life: 0, maxLife: 1, active: false
}));

function spawnParticle(wx, wy, wz) {
  for (let i = 0; i < MAX_P; i++) {
    if (!parts[i].active) {
      const p = parts[i];
      p.active = true;
      p.x = wx + (Math.random() - 0.5) * 0.15;
      p.y = wy + (Math.random() - 0.5) * 0.15;
      p.z = wz + Math.random() * 0.1;
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.015 + Math.random() * 0.04;
      p.vx = Math.cos(angle) * speed;
      p.vy = Math.sin(angle) * speed + 0.008;
      p.vz = (Math.random() - 0.2) * speed * 1.5;
      p.maxLife = 50 + Math.random() * 70;
      p.life = p.maxLife;
      return;
    }
  }
}

// Text bounding regions in canvas-space UV (u: 0–1, v: 0–1 top-bottom)
const textRegions = [
  { u: 0.5, v: 0.193, uw: 0.22, vh: 0.05 },
  { u: 0.5, v: 0.390, uw: 0.80, vh: 0.26 },
  { u: 0.5, v: 0.635, uw: 0.78, vh: 0.17 },
  { u: 0.5, v: 0.775, uw: 0.82, vh: 0.08 },
];

function inTextRegion(cu, cv) {
  for (const r of textRegions)
    if (Math.abs(cu - r.u) < r.uw * 0.5 && Math.abs(cv - r.v) < r.vh * 0.5) return true;
  return false;
}

const hitRay = new THREE.Raycaster();
let spawnCooldown = 0;

function updateParticles() {
  // Raycast mouse → cloth, check if over text
  if (mouseActive && spawnCooldown <= 0) {
    hitRay.setFromCamera(mouseNDC, camera);
    const hits = hitRay.intersectObject(clothMesh);
    if (hits.length > 0 && hits[0].uv) {
      const cu = hits[0].uv.x;
      const cv = 1 - hits[0].uv.y;
      if (inTextRegion(cu, cv)) {
        const wp = hits[0].point;
        for (let s = 0; s < 5; s++) spawnParticle(wp.x, wp.y, wp.z);
        spawnCooldown = 3;
      }
    }
  }
  if (spawnCooldown > 0) spawnCooldown--;

  const posAttr = pGeo.attributes.position;
  const alphaAttr = pGeo.attributes.alpha;

  for (let i = 0; i < MAX_P; i++) {
    const p = parts[i];
    if (p.active) {
      p.x += p.vx; p.y += p.vy; p.z += p.vz;
      p.vx *= 0.97; p.vy *= 0.97; p.vz *= 0.97;
      p.vy -= 0.0003;
      p.life--;
      if (p.life <= 0) p.active = false;
      const t = p.life / p.maxLife;
      posAttr.setXYZ(i, p.x, p.y, p.z);
      alphaAttr.setX(i, t * t * 0.85);
    } else {
      posAttr.setXYZ(i, 0, -9999, 0);
      alphaAttr.setX(i, 0);
    }
  }
  posAttr.needsUpdate = true;
  alphaAttr.needsUpdate = true;
}

// ─── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

// ─── Loop ──────────────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  updateCloth();
  syncGeometry();
  updateParticles();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
