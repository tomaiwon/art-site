<style>
  /* 纯复刻 a24.raviklaassens.com（Ravi Klaassens 的 A24 概念站）首页：
     浅灰底 + 颗粒 / 顶部居中导航（手机为底部白色停靠栏）+ Index 片单 / 左上信息面板 / 底部两条评语 /
     Three.js 光盘：相机 FOV 40、距离 4.4，整组绕 X、Y 各转 -30°，沿弧线排开。
     字体：PP Eiko → Instrument Serif，PP Neue Montreal → Inter，PP Museum → Instrument Serif（付费字体未授权，暂用替代） */
  :root{
    --bg:#f2f2f2;
    --fg:#000;
    --accent:#e4553b;
    --serif:"Instrument Serif","PP Eiko","Songti SC","STSong","Noto Serif SC",serif;
    --sans:"Inter","PP Neue Montreal","PingFang SC","Noto Sans SC",Arial,sans-serif;
    --ease:cubic-bezier(.32,.72,0,1);

    /* 原站的流式字号：容器宽 / (理想宽 / 16) */
    --size-container-ideal:1920;
    --size-container-min:992px;
    --size-container-max:3840px;
    --size-container-fluid:100dvw;
    --size-container:clamp(var(--size-container-min), var(--size-container-fluid), var(--size-container-max));
    --size-font:calc(var(--size-container) / (var(--size-container-ideal) / 16));
  }
  @media screen and (min-width:992px) and (min-aspect-ratio:11/5){ :root{ --size-container-fluid:min(100dvw, calc(100dvh * 16 / 9)); } }
  @media screen and (max-width:991px){ :root{ --size-container-ideal:991; --size-container-min:768px; --size-container-max:991px; } }
  @media screen and (max-width:767px){ :root{ --size-container-ideal:767; --size-container-min:480px; --size-container-max:767px; } }
  @media screen and (max-width:479px){ :root{ --size-container-ideal:479; --size-container-min:320px; --size-container-max:479px; } }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);}
  body{
    font-family:var(--sans);font-size:var(--size-font);font-weight:500;line-height:1.4;letter-spacing:-.025em;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  }
  a{color:inherit;text-decoration:none;}
  button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;}
  p,h1,h2{margin:0;}
  :focus:not(:focus-visible){outline:0;}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0;}

  /* ── 字级（原站 heading-s / heading-xs / subheading-xs / paragraph-m） ── */
  .heading-s{font-family:var(--serif);font-weight:400;font-size:2.5em;line-height:1.1;letter-spacing:-.04em;text-transform:uppercase;}
  .heading-xs{font-family:var(--serif);font-weight:400;font-size:1.75em;line-height:1.1;letter-spacing:-.04em;text-transform:uppercase;}
  .subheading-xs{font-family:var(--serif);font-weight:400;font-size:.625em;line-height:1.3;letter-spacing:.2em;text-transform:uppercase;}
  .paragraph-m{font-size:1.125em;line-height:1.4;letter-spacing:-.025em;}
  .text-right{text-align:right;}
  .text-center{text-align:center;}
  @media (max-width:991px){
    .heading-s{font-size:2em;}
    .heading-xs{font-size:1.375em;}
  }
  @media (max-width:767px){
    .heading-s{font-size:1.5em;}
  }

  /* ── 颗粒（原站 .grain：opacity .2，逐帧跳位） ── */
  .grain{
    position:fixed;inset:-1em;z-index:99;pointer-events:none;opacity:.2;
    background-size:7.8125em;background-position:50%;
    animation:grain .5s steps(1) infinite;
  }
  @keyframes grain{
    0%{background-position:50% 50%}17%{background-position:12% 71%}33%{background-position:83% 24%}
    50%{background-position:37% 9%}67%{background-position:66% 88%}83%{background-position:5% 42%}
  }

  /* ── 主画面 ── */
  .hero{position:fixed;inset:0;overflow:hidden;outline:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
  .hero[data-dragging]{cursor:grabbing;}
  .experience-canvas{position:absolute;inset:0;z-index:2;pointer-events:none;}
  .experience-canvas canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .container{position:relative;z-index:3;height:100%;padding:0 .5em;pointer-events:none;}
  .experience_wrap{height:100%;padding:.5em 0;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;}

  .experience_info{display:flex;flex-direction:column;gap:.5em;width:100%;max-width:20.8333%;}
  .title-alt{margin-top:-.35em;}
  .info-content{display:flex;flex-direction:column;align-items:flex-end;width:100%;}
  .info-content_panel{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:1em;width:100%;padding:.25em 0;}
  .divider-horizontal{position:absolute;left:0;right:0;top:0;height:.5px;background:var(--fg);transform-origin:0 50%;}
  .info-content_label-wrap{padding-top:.3em;flex:none;}

  .testimonial_wrap{display:flex;justify-content:center;align-items:flex-end;gap:.5em;margin:0 auto;padding-bottom:2.5em;}
  .testimonial{display:flex;flex-direction:column;gap:1.625em;min-width:var(--testimonial-width, 20rem);}
  .testimonial__text{display:flex;flex-direction:column;gap:.325em;}
  .testimonial [data-quote-line]{display:block;}
  @media (max-width:991px){
    .experience_info{max-width:50%;}
    .testimonial_wrap{padding-bottom:6em;}
  }
  @media (max-width:767px){
    .experience_info{max-width:100%;}
    .testimonial_wrap{display:none;}
  }

  /* 文字遮罩切换（原站 data-disc-mask / data-disc-line-mask） */
  [data-mask]{display:block;position:relative;min-width:0;}
  [data-mask="clip"]{overflow:hidden;}
  .line-mask{display:block;overflow:hidden;}
  .line{display:block;will-change:transform;}

  /* ── 导航（桌面：顶部居中；≤991：底部白色停靠栏） ── */
  .nav{
    --nav-open-height:24em;--nav-scroll-fade:3em;--nav-open-duration:.62s;--nav-close-duration:.46s;
    position:fixed;top:0;left:0;right:0;z-index:100;color:var(--fg);
  }
  .nav-container{position:relative;z-index:1;width:100%;padding:0 3em;}
  .nav-bg,.nav-dropdown{
    position:absolute;top:0;left:0;right:0;margin:0 auto;width:28em;height:0;overflow:hidden;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:height var(--nav-close-duration) var(--ease), opacity calc(var(--nav-close-duration) * .6) var(--ease), visibility 0s linear calc(var(--nav-close-duration) * .6);
  }
  .nav-bg{z-index:1;background:#fff;}
  .nav-inner{position:relative;z-index:2;display:flex;justify-content:center;align-items:center;padding-top:.5em;}
  .nav-list{display:flex;justify-content:center;align-items:center;margin:0;padding:0;list-style:none;}
  .nav-list > li{display:flex;align-items:center;}
  .nav-logo{position:relative;z-index:2;display:flex;align-items:center;padding:.5em 1em;font-family:var(--serif);font-style:italic;font-size:1.35em;line-height:.83;letter-spacing:-.02em;white-space:nowrap;}
  .nav-link{position:relative;z-index:2;display:flex;align-items:center;gap:.375em;padding:.5em 1em;border-radius:.25em;transition:opacity .3s var(--ease);}
  .nav-link[data-page="other"]{opacity:.6;}
  .nav-link[data-page="other"]:hover{opacity:1;}
  .nav-link__label{position:relative;display:block;font-size:1.125em;line-height:1;letter-spacing:-.025em;}
  /* 悬停时文字上翻 */
  .hov{display:block;overflow:hidden;}
  .hov > span{display:block;transition:transform .5s var(--ease);}
  .hov > span::after{content:attr(data-text);display:block;position:absolute;top:130%;left:0;}
  .hov{position:relative;}
  @media (hover:hover) and (pointer:fine){ .nav-link:hover .hov > span{transform:translateY(-130%);} }
  .nav-page-dot{position:absolute;left:50%;bottom:.1em;width:.3em;height:.3em;margin-left:-.15em;border-radius:50%;background:currentColor;pointer-events:none;}
  /* Index：文字与数量上下切换 */
  .idx-label{position:relative;display:block;overflow:hidden;transition:width .5s var(--ease);}
  .idx-label span{display:block;transition:transform .5s var(--ease);white-space:nowrap;}
  .idx-label .idx-count{position:absolute;left:0;top:0;transform:translateY(130%);}
  .nav[data-dropdown="open"] .idx-label .idx-word{transform:translateY(-130%);}
  .nav[data-dropdown="open"] .idx-label .idx-count{transform:translateY(0);}
  @media (hover:hover) and (pointer:fine){
    .idx-btn:hover .idx-label .idx-word{transform:translateY(-130%);}
    .idx-btn:hover .idx-label .idx-count{transform:translateY(0);}
  }
  .idx-icon{width:.875em;height:.875em;transition:transform var(--nav-close-duration) var(--ease);}
  .nav[data-dropdown="open"] .idx-icon{transform:rotate(180deg);transition-duration:var(--nav-open-duration);}
  /* 加载中：Projecting + 转圈 */
  .nav-list > li.nav-loading-item{display:none;}
  html.is-loading .nav-list > li.nav-loading-item{display:flex;}
  html.is-loading .nav-list > li:not(.nav-loading-item):not(.li-logo){display:none;}
  .nav-loading{display:flex;align-items:center;gap:.5em;padding:.5em 1em;opacity:.6;}
  .nav-loading i{width:.8em;height:.8em;border-radius:50%;border:1.5px solid currentColor;border-top-color:transparent;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .nav-list > li.enter{animation:navIn .7s var(--ease) both;}
  @keyframes navIn{from{transform:translateY(105%);opacity:0;}}

  /* 下拉片单 */
  .nav-dropdown{z-index:1;padding-top:5em;}
  .nav[data-dropdown="open"] .nav-bg,.nav[data-dropdown="open"] .nav-dropdown{
    height:var(--nav-open-height);opacity:1;visibility:visible;
    transition:height var(--nav-open-duration) var(--ease), opacity calc(var(--nav-open-duration) * .45) var(--ease), visibility 0s;
  }
  .nav[data-dropdown="open"] .nav-dropdown{pointer-events:auto;}
  .nav-dropdown__content{
    --fade-top:0;--fade-bottom:1;
    height:100%;overflow-y:auto;overscroll-behavior-y:contain;scrollbar-width:none;touch-action:pan-y;
    -webkit-mask-image:linear-gradient(to bottom,#0000 0,#000 calc(var(--nav-scroll-fade) * var(--fade-top)),#000 calc(100% - var(--nav-scroll-fade) * var(--fade-bottom)),#0000 100%);
            mask-image:linear-gradient(to bottom,#0000 0,#000 calc(var(--nav-scroll-fade) * var(--fade-top)),#000 calc(100% - var(--nav-scroll-fade) * var(--fade-bottom)),#0000 100%);
  }
  .nav-dropdown__content::-webkit-scrollbar{display:none;}
  .nav-dropdown__list{padding:0 6em 5em;}
  .dd-link{position:relative;display:flex;width:100%;padding:.25em;overflow:hidden;transition:color .14s var(--ease);}
  .dd-link__bg{position:absolute;inset:0;background:var(--fg);transform:scaleY(0);transform-origin:50% 100%;transition:transform .45s var(--ease);pointer-events:none;}
  .dd-link__inner{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;width:100%;min-width:0;pointer-events:none;}
  .dd-link__label{font-size:1.125em;line-height:1.4;letter-spacing:-.025em;}
  .dd-link__inner > .dd-link__label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding-right:.5em;}
  .dd-year{display:inline-block;flex:none;overflow:hidden;vertical-align:bottom;}
  .dd-year .dd-link__label{display:block;transform:translateY(110%);transition:transform .45s var(--ease);}
  .dd-link[aria-current="true"],.dd-link:focus-visible{color:var(--bg);}
  .dd-link[aria-current="true"] .dd-link__bg,.dd-link:focus-visible .dd-link__bg{transform:scaleY(1);}
  .dd-link[aria-current="true"] .dd-year .dd-link__label,.dd-link:focus-visible .dd-year .dd-link__label{transform:none;}
  @media (hover:hover) and (pointer:fine){
    .dd-link:hover{color:var(--bg);}
    .dd-link:hover .dd-link__bg{transform:scaleY(1);}
    .dd-link:hover .dd-year .dd-link__label{transform:none;}
  }
  .nav-dropdown__scrollbar{position:absolute;right:1em;top:32%;bottom:32%;z-index:4;width:.375em;background:#d9d9d9;opacity:0;transform:translateY(.5em);transition:opacity .3s var(--ease), transform .46s var(--ease);}
  .nav[data-dropdown="open"] .nav-dropdown__scrollbar{opacity:1;transform:none;transition:opacity .31s var(--ease) .12s, transform .62s var(--ease) .12s;}
  .nav-dropdown__scrollbar i{position:absolute;left:0;right:0;top:0;height:50%;background:var(--fg);}
  .page-bg{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity var(--nav-close-duration) var(--ease);}
  .nav[data-dropdown="open"] ~ .page-bg{opacity:1;pointer-events:auto;transition-duration:var(--nav-open-duration);}

  @media (max-width:991px){
    .nav{
      --nav-dock-height:3.5em;--nav-dock-inset:1em;--nav-open-height:min(25em, 62vh);
      --nav-dock-open-width:min(100%, max(var(--nav-dock-width, 100%), 23.75em));
      top:auto;bottom:0;padding:0 var(--nav-dock-inset) calc(var(--nav-dock-inset) + env(safe-area-inset-bottom, 0px));
    }
    .nav-container{padding:0;}
    .nav-bg{
      top:auto;bottom:0;left:50%;right:auto;margin:0;transform:translateX(-50%);
      width:var(--nav-dock-width, 100%);max-width:100%;height:var(--nav-dock-height);opacity:1;visibility:visible;
      transition:height var(--nav-close-duration) var(--ease), width var(--nav-close-duration) var(--ease);
    }
    .nav[data-dropdown="open"] .nav-bg{width:var(--nav-dock-open-width);transition:height var(--nav-open-duration) var(--ease), width var(--nav-open-duration) var(--ease);}
    .nav-inner{height:var(--nav-dock-height);padding-top:0;}
    .nav-list{
      width:calc(var(--nav-dock-width, 100%) - 1em);max-width:100%;gap:.25em;
      transition:width var(--nav-close-duration) var(--ease);
    }
    .nav[data-dropdown="open"] .nav-list{width:calc(var(--nav-dock-open-width) - 1em);transition-duration:var(--nav-open-duration);}
    .nav-list > li.li-logo,.nav-list > li:last-child{flex:1 1 0;min-width:0;}
    .nav-list > li:last-child{justify-content:flex-end;}
    .nav-logo{font-size:1.5em;padding:.5em .75em;}
    .nav-link{padding:.5em .75em;}
    .nav-link__label{font-size:1em;}
    .idx-icon{transform:rotate(180deg);}
    .nav[data-dropdown="open"] .idx-icon{transform:rotate(0deg);}
    .nav-dropdown{
      top:auto;bottom:var(--nav-dock-height);left:50%;right:auto;margin:0;transform:translateX(-50%);
      width:var(--nav-dock-open-width);padding-top:0;
    }
    .nav[data-dropdown="open"] .nav-dropdown{height:calc(var(--nav-open-height) - var(--nav-dock-height));}
    .nav-dropdown__list{padding:3em 4em 1em;}
    .dd-link{padding:.6em .5em;}
    .dd-link__label{font-size:1em;}
    .nav.is-hidden{opacity:0;pointer-events:none;transition:opacity .3s;}
  }

  /* ── 预告片灯箱（原站 trailer-lightbox） ── */
  .lb{position:fixed;inset:0;z-index:95;color:#fff;visibility:hidden;pointer-events:none;}
  .lb.is-open{visibility:visible;pointer-events:auto;}
  .lb-plate{position:absolute;inset:0;background:#000;clip-path:inset(50% 50% 50% 50%);}
  .lb-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;}
  .lb-frame{position:relative;width:min(100vw, calc(100dvh * 16 / 9));aspect-ratio:16/9;background:#000;}
  .lb-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;}
  .lb-shield{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .lb-center{width:2em;height:2em;opacity:0;transition:opacity .3s var(--ease);}
  .lb-shield:hover .lb-center{opacity:1;}
  .lb-ui{position:absolute;left:1.5em;right:1.5em;display:flex;align-items:center;gap:1.5em;opacity:0;}
  .lb-top{top:3.5em;justify-content:space-between;align-items:flex-start;}
  .lb-bottom{bottom:1.5em;}
  .lb-meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2em .5em;max-width:28em;}
  .lb-meta .paragraph-m{font-size:1.05em;}
  .lb-ctl{font-family:var(--serif);font-size:1.35em;line-height:1;letter-spacing:-.04em;text-transform:uppercase;white-space:nowrap;}
  .lb-ctl .ico{display:none;width:1.1em;height:1.1em;}
  .lb-actions{display:flex;gap:1.25em;}
  .lb-time{font-family:var(--serif);font-size:.85em;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .lb-timeline{position:relative;flex:1;height:1.5em;cursor:pointer;}
  .lb-timeline i{position:absolute;left:0;top:50%;height:1px;margin-top:-.5px;}
  .lb-timeline .rule{right:0;background:rgba(255,255,255,.35);}
  .lb-timeline .buf{width:0;background:rgba(255,255,255,.55);}
  .lb-timeline .prog{width:0;background:#fff;}
  .lb-volume{position:relative;width:4em;height:1.5em;cursor:pointer;}
  .lb-volume i{position:absolute;left:0;top:50%;height:1px;margin-top:-.5px;}
  .lb-volume .rule{right:0;background:rgba(255,255,255,.35);}
  .lb-volume .lvl{width:100%;background:#fff;}
  .lb-unmute{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:auto;display:block;padding:.6em 1.1em;border:1px solid rgba(255,255,255,.6);font-family:var(--serif);font-size:1.35em;line-height:1;letter-spacing:-.04em;text-transform:uppercase;}
  .lb-unmute:hover{background:#fff;color:#000;}
  .lb[data-muted="false"] .lb-unmute{display:none;}
  .nav.on-dark{color:#fff;}
  @media (max-width:767px){
    .lb-top{top:1.5em;}
    .lb-meta{display:none;}
    .lb-ctl .txt{display:none;}
    .lb-ctl .ico{display:block;}
    .lb-close .txt,.lb-project .txt{display:inline;}
    .lb-close .ico,.lb-project .ico{display:none;}
    .lb-volume{display:none;}
    .lb-bottom{gap:1em;}
    .lb-top{justify-content:flex-end;}
  }

  /* 无 WebGL 时的平面替代 */
  .fallback{position:absolute;left:50%;top:50%;z-index:2;width:min(60vw,60vh);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;display:none;pointer-events:none;}
  .fallback img{width:100%;height:100%;object-fit:cover;}
  html.no-webgl .fallback{display:block;}

  @media (prefers-reduced-motion:reduce){
    .grain{animation:none;}
    .hov > span,.idx-label span,.dd-link__bg,.dd-year .dd-link__label{transition:none;}
  }
</style>
</head>

<body>
<div class="grain" id="grain" aria-hidden="true"></div>

<!-- 导航 -->
<nav class="nav" id="nav" aria-label="Main" data-dropdown="closed">
  <div class="nav-container">
    <div class="nav-bg" id="navBg"></div>
    <div class="nav-inner">
      <ul class="nav-list" id="navList">
        <li class="li-logo"><a class="nav-logo" href="./" aria-label="Yi Huang home">Yi Huang</a></li>
        <li class="nav-loading-item" aria-live="polite"><span class="nav-loading"><span class="nav-link__label">Projecting</span><i aria-hidden="true"></i></span></li>
        <li><a class="nav-link" href="news-disc.html" aria-current="page" data-page="current"><span class="nav-link__label hov"><span data-text="News">News</span></span><span class="nav-page-dot" aria-hidden="true"></span></a></li>
        <li><a class="nav-link" href="../work.html" data-page="other"><span class="nav-link__label hov"><span data-text="Works">Works</span></span></a></li>
        <li>
          <button class="nav-link idx-btn" id="idxBtn" type="button" aria-expanded="false" aria-haspopup="true" aria-controls="navDropdown">
            <span class="nav-link__label idx-label" id="idxLabel"><span class="idx-word">Index</span><span class="idx-count" id="idxCount" aria-hidden="true"></span></span>
            <svg class="idx-icon" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 5 7 9.5 11.5 5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
        </li>
      </ul>
    </div>

<script type="module">
import * as THREE from 'three';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

const ITEMS = window.ITEMS;
const COUNT = ITEMS.length;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const html = document.documentElement;
const hero = $('hero');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const touchLayoutMQ = matchMedia('(max-width: 991px)');
const touchLayout = () => touchLayoutMQ.matches;
const finePointer = matchMedia('(hover: hover) and (pointer: fine)').matches;
const gsap = window.gsap;

/* 原站的缓动：cubic-bezier(.32,.72,0,1)（discGlide / energy） */
function bezier(x1, y1, x2, y2){
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t;
  const sy = (t) => ((ay * t + by) * t + cy) * t;
  const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => {
    if(x <= 0) return 0; if(x >= 1) return 1;
    let t = x;
    for(let i = 0; i < 8; i++){ const e = sx(t) - x; if(Math.abs(e) < 1e-6) break; const d = dx(t); if(Math.abs(d) < 1e-6) break; t -= e / d; }
    return sy(clamp(t, 0, 1));
  };
}
const glide = bezier(.32, .72, 0, 1);

/* ─────────────── 颗粒 ─────────────── */
(() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'); const d = x.createImageData(128, 128);
  for(let i = 0; i < d.data.length; i += 4){ d.data[i] = d.data[i + 1] = d.data[i + 2] = 0; d.data[i + 3] = Math.random() * 21; }
  x.putImageData(d, 0, 0);
  $('grain').style.backgroundImage = `url(${c.toDataURL()})`;
})();

/* ─────────────── 导航与 Index 片单 ─────────────── */
const nav = $('nav'), idxBtn = $('idxBtn'), ddList = $('ddList'), ddContent = $('ddContent');
$('idxCount').textContent = COUNT;
ITEMS.forEach((it, i) => {
  const row = document.createElement('div'); row.setAttribute('role', 'listitem');
  const a = document.createElement('a');
  a.className = 'dd-link'; a.href = it.href;
  a.innerHTML = '<span class="dd-link__bg" aria-hidden="true"></span><span class="dd-link__inner"><h2 class="dd-link__label"></h2><span class="dd-year"><span class="dd-link__label"></span></span></span>';
  a.querySelector('h2').textContent = it.title;
  a.querySelector('.dd-year .dd-link__label').textContent = it.date;
  a.addEventListener('click', (e) => { e.preventDefault(); setDropdown(false); gallery?.goTo(i, 'click'); });
  row.appendChild(a); ddList.appendChild(row);
});
function sizeIndexLabel(){
  const label = $('idxLabel');
  const open = nav.dataset.dropdown === 'open' || (finePointer && idxBtn.matches(':hover'));
  const el = label.querySelector(open ? '.idx-count' : '.idx-word');
  label.style.width = el.scrollWidth + 'px';
}
idxBtn.addEventListener('mouseenter', sizeIndexLabel);
idxBtn.addEventListener('mouseleave', sizeIndexLabel);
function setDropdown(open){
  nav.dataset.dropdown = open ? 'open' : 'closed';
  idxBtn.setAttribute('aria-expanded', String(open));
  $('navDropdown').setAttribute('aria-hidden', String(!open));
  sizeIndexLabel();
  if(open){
    const cur = ddList.querySelector('[aria-current="true"]');
    /* 当前条目停在列表顶部（前面留一行） */
    if(cur){
      const row = cur.getBoundingClientRect(), box = ddList.getBoundingClientRect();
      ddContent.scrollTop = Math.max(0, row.top - box.top - row.height);
    }
    updateDropdownScroll();
  }
}
idxBtn.addEventListener('click', (e) => { e.stopPropagation(); setDropdown(nav.dataset.dropdown !== 'open'); });
$('pageBg').addEventListener('click', () => setDropdown(false));
document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && nav.dataset.dropdown === 'open'){ setDropdown(false); idxBtn.focus(); } });
function updateDropdownScroll(){
  const max = ddContent.scrollHeight - ddContent.clientHeight;
  const p = max > 0 ? ddContent.scrollTop / max : 0;
  ddContent.style.setProperty('--fade-top', clamp(ddContent.scrollTop / 40, 0, 1).toFixed(3));
  ddContent.style.setProperty('--fade-bottom', clamp((max - ddContent.scrollTop) / 40, 0, 1).toFixed(3));
  const bar = $('ddBar'), prog = $('ddBarProg');
  const ratio = max > 0 ? ddContent.clientHeight / ddContent.scrollHeight : 1;
  prog.style.height = (ratio * 100) + '%';
  prog.style.transform = `translateY(${p * (1 - ratio) / ratio * 100}%)`;
  bar.style.visibility = max > 0 ? '' : 'hidden';
}
ddContent.addEventListener('scroll', updateDropdownScroll, { passive:true });
/* 滚轮在片单里只滚片单 */
ddContent.addEventListener('wheel', (e) => e.stopPropagation(), { passive:true });

/* 手机停靠栏宽度 = 内容宽度 */
function sizeDock(){
  if(!touchLayout()){ nav.style.removeProperty('--nav-dock-width'); return; }
  const list = $('navList');
  let w = 0; [...list.children].forEach((li) => { if(getComputedStyle(li).display !== 'none') w += li.firstElementChild.getBoundingClientRect().width; });
  const em = parseFloat(getComputedStyle(nav).fontSize);
  nav.style.setProperty('--nav-dock-width', Math.ceil(w + em * 2.75) + 'px');
}

/* ─────────────── 信息面板：写入 + 遮罩切换（原站 disc transitions） ─────────────── */
const T = { settleDelay:100, dragRevealCap:500, outDuration:.4, outLineStagger:.016, outItemStagger:.016, outShift:-120,
            inDuration:.7, inLineStagger:.05, inItemStagger:.035, inGroupGap:.06, inShift:120, heightDuration:.5, reverseSpeed:1.6 };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const CJK = /[　-鿿＀-￯]/;

/* 两行平衡断句（原站影评的做法） */
function balance(text){
  const t = String(text).trim();
  if(/\s/.test(t)){
    const w = t.split(/\s+/); if(w.length < 2) return [t];
    let best = 1, score = Infinity;
    for(let k = 1; k < w.length; k++){
      const a = w.slice(0, k).join(' '), b = w.slice(k).join(' ');
      const s = Math.abs(a.length - b.length) + Math.abs(k - (w.length - k)) * 2;
      if(s < score){ score = s; best = k; }
    }
    return [w.slice(0, best).join(' '), w.slice(best).join(' ')];
  }
  const m = t.match(/^(.+?[，、：])(.+)$/);
  return m ? [m[1], m[2]] : [t];
}

function writePanel(i){
  const it = ITEMS[i];
  const set = (k, v) => hero.querySelectorAll(`[data-t="${k}"]`).forEach((el) => { el.innerHTML = v; });
  set('title', esc(it.title));
  set('alt', esc(it.alt));
  set('type', esc(it.type));
  set('date', esc(it.date));
  set('venue', it.venue.map(esc).join('<br>'));
  it.notes.forEach((n, k) => {
    set('pub' + k, esc(n[0]));
    set('quote' + k, balance(n[1]).map((l) => `<span data-quote-line>${esc(l)}</span>`).join(''));
  });
  hero.dataset.writtenIndex = i;
}

/* 影评宽度统一为最宽那条（原站 --testimonial-width） */
function measureTestimonials(){
  const wrap = $('testimonials'); if(getComputedStyle(wrap).display === 'none') return;
  const probe = wrap.querySelector('.testimonial').cloneNode(true);
  Object.assign(probe.style, { position:'absolute', left:'-100000px', top:'0', width:'max-content', minWidth:'0', visibility:'hidden' });
  hero.querySelector('.experience_wrap').appendChild(probe);
  let max = 0;
  ITEMS.forEach((it) => it.notes.forEach((n) => {
    probe.querySelector('[data-t^="pub"]').textContent = n[0];
    probe.querySelector('[data-t^="quote"]').innerHTML = balance(n[1]).map((l) => `<span data-quote-line>${esc(l)}</span>`).join('');
    max = Math.max(max, probe.offsetWidth);
  }));
  probe.remove();
  hero.style.setProperty('--testimonial-width', Math.ceil(max) + 'px');
}

/* 把一段文字拆成逐行（每行一个遮罩） */
function splitLines(el){
  if(el.dataset.plain != null) return [...el.querySelectorAll('.line')];
  el.dataset.plain = el.innerHTML;
  const blocks = el.innerHTML.split(/<br\s*\/?>/i);
  const tmp = document.createElement('div');
  el.innerHTML = '';
  const tokenSpans = [];
  blocks.forEach((b, bi) => {
    const block = document.createElement('span'); block.style.display = 'block';
    tmp.innerHTML = b;
    const hasQuoteLines = tmp.querySelector('[data-quote-line]');
    if(hasQuoteLines){ [...tmp.children].forEach((q) => { const s = document.createElement('span'); s.style.display = 'block'; s.dataset.forced = '1'; s.textContent = q.textContent; block.appendChild(s); tokenSpans.push(s); }); }
    else{
      const text = tmp.textContent;
      const toks = text.match(/[　-鿿＀-￯]|[^\s　-鿿＀-￯]+|\s+/g) || [];
      toks.forEach((tk) => {
        if(/^\s+$/.test(tk)){ block.appendChild(document.createTextNode(tk)); return; }
        const s = document.createElement('span'); s.textContent = tk; block.appendChild(s); tokenSpans.push(s);
      });
    }
    block.dataset.block = bi;
    el.appendChild(block);
  });
  /* 按 offsetTop 分行 */
  const lines = [];
  let cur = null, top = null, curBlock = null;
  tokenSpans.forEach((s) => {
    const b = s.parentNode;
    const tp = s.offsetTop;
    if(s.dataset.forced || b !== curBlock || top === null || Math.abs(tp - top) > 2){ cur = []; lines.push(cur); top = tp; curBlock = b; }
    cur.push(s);
  });
  const texts = lines.map((ln) => {
    const first = ln[0], last = ln[ln.length - 1];
    let t = '', n = first;
    while(n){ t += n.textContent; if(n === last) break; n = n.nextSibling; }
    return t.trim();
  });
  el.innerHTML = texts.map((t) => `<span class="line-mask"><span class="line">${esc(t)}</span></span>`).join('');
  return [...el.querySelectorAll('.line')];
}
function unsplit(el){
  if(el.dataset.plain == null) return;
  el.innerHTML = el.dataset.plain; delete el.dataset.plain;
}

const flow = (() => {
  const items = [];
  hero.querySelectorAll('[data-group]').forEach((g) => {
    const group = +g.dataset.group;
    g.querySelectorAll('[data-t], [data-rule]').forEach((el) => {
      items.push({ el, group, kind: el.hasAttribute('data-rule') ? 'rule' : 'text', mask: el.closest('[data-mask]') });
    });
  });
  let state = 'hidden', outTl = null, inTl = null, lastChange = 0, poll = 0, pending = -1;
  const setMasks = (clip) => items.forEach((it) => it.mask && it.mask.setAttribute('data-mask', clip ? 'clip' : ''));
  const lockHeights = () => items.forEach((it) => { if(it.mask && !it.mask.style.height) it.mask.style.height = it.mask.offsetHeight + 'px'; });
  const unlockHeights = () => items.forEach((it) => { if(it.mask) it.mask.style.height = ''; });
  const visible = (it) => it.el.offsetParent !== null;

  function hideAll(){
    items.forEach((it) => it.kind === 'rule' ? gsap.set(it.el, { scaleX:0, transformOrigin:'left center' }) : gsap.set(it.el, { autoAlpha:0 }));
  }
  function out(){
    if(reduce || state === 'hidden') return;
    if(state === 'revealing' && inTl){
      const tl = inTl; inTl = null; outTl = tl; state = 'hidden';
      tl.eventCallback('onComplete', null);
      tl.eventCallback('onReverseComplete', outDone);
      tl.timeScale(T.reverseSpeed).reverse();
      schedule(); return;
    }
    state = 'hidden';
    lockHeights(); setMasks(true);
    outTl = gsap.timeline({ onComplete: outDone });
    items.forEach((it, k) => {
      const at = k * T.outItemStagger;
      if(it.kind === 'rule'){ outTl.to(it.el, { scaleX:0, transformOrigin:'right center', duration:T.outDuration, ease:glide, overwrite:'auto' }, at); return; }
      const lines = visible(it) ? splitLines(it.el) : [it.el];
      gsap.set(it.el, { autoAlpha:1 });
      outTl.to(lines, { yPercent:T.outShift, duration:T.outDuration, ease:glide, stagger:T.outLineStagger, overwrite:'auto' }, at);
    });
    schedule();
  }
  function outDone(){

function drawArc(ctx, text, cx, cy, r, startDeg, size, color){

  words.forEach((w) => { const t = cur ? cur + joiner + w : w; if(ctx.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; });

}

  function onDragMove(e){
    if(!pointerDown || e.pointerId !== pointerId) return;
    const p = setPointer(e); ptrNX = ndc.x; ptrNY = ndc.y;
    if(!dragging){
      const dx = p.x - downX, dy = p.y - downY;
      if(Math.hypot(dx, dy) < P.dragStartDistance) return;
      if(touchPtr && Math.abs(dx) >= Math.abs(dy)) pressCandidate = -1;
      beginDrag(e);
    }
    if(e.cancelable) e.preventDefault();
    const now = performance.now(), dx = p.x - prevX, dy = p.y - prevY, dtm = Math.max(8, now - prevT);
    prevX = p.x; prevY = p.y; prevT = now;
    kick();
    if(grabbed >= 0){
      const d = discs[grabbed], k = P.dragSensitivity * .0045;
      d.spinY = softSpin(d.spinY, dx * k); d.spinX = softSpin(d.spinX, dy * k); return;
    }
    const span = touchPtr ? (dragSpan || 1.8) : 6 * P.dragSensitivity;
    const step = -(dx / p.rect.width) * span;
    L = clamp(L + step, 0, COUNT - 1);
    const vel = clamp((16.667 / dtm) * step, -P.dragMaxVelocity, P.dragMaxVelocity);
    dragVel += (vel - dragVel) * P.dragVelocitySmoothing;
  }
  function endPointer(cancel){
    if(!pointerDown) return;
    const wasDragging = dragging, g = grabbed;
    pointerDown = false; dragging = false; grabbed = -1; pressCandidate = -1;
    window.removeEventListener('pointermove', onDragMove, { passive:false });
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
    hero.removeAttribute('data-dragging');
    try{ if(hero.hasPointerCapture(pointerId)) hero.releasePointerCapture(pointerId); }catch(err){}
    kick();
    if(!wasDragging) return;
    suppressClickUntil = performance.now() + 140;
    if(g >= 0){ resetSpin(g); dragVel = 0; return; }
    if(cancel){ dragVel = 0; goTo(Math.round(L)); return; }
    if(touchPtr){
      const dir = Math.abs(dragVel) >= P.touchFlickVelocity ? Math.sign(dragVel) : 0;
      const t = dir > 0 ? Math.floor(L) + 1 : dir < 0 ? Math.ceil(L) - 1 : Math.round(L);
      dragVel = 0; goTo(clamp(t, 0, COUNT - 1), 'flick'); return;
    }
    if(reduce) goTo(Math.round(L));
  }
  const onUp = () => endPointer(false);
  const onCancel = () => endPointer(true);
  function onHoverMove(e){
    if(pointerDown || !finePointer) return;
    setPointer(e);
    const now = performance.now(), gap = now - lastMoveT; lastMoveT = now;
    if(gap < 120){ const k = 16.7 / Math.max(8, gap); mvx = (e.clientX - lastMX) * k; mvy = (e.clientY - lastMY) * k; } else mvx = mvy = 0;
    lastMX = e.clientX; lastMY = e.clientY; ptrNX = ndc.x; ptrNY = ndc.y;
    keyboardNav = false; pickDirty = true; kick();
  }
  function onClick(e){
    if(flight || performance.now() < suppressClickUntil){ e.preventDefault(); e.stopPropagation(); return; }
    if(e.target.closest('a, button')) return;
    setPointer(e);
    const hit = pick();
    if(hit < 0) return;
    e.preventDefault();
    if(hit !== W){ resetWheel(); press(hit); goTo(hit, 'click'); return; }
    press(hit); open(hit, e);
  }

  /* 滚轮：一次手势只翻一张（原站的包络 + 节拍判定） */
  let wAccum = 0, wDir = 0, wEnvelope = 0, wLastT = 0, wArmed = true, wHasLast = false, wCount = 0, wPeak = 0, wStepT = 0, wRising = false, wIdle = 0;
  function resetWheel(){ clearTimeout(wIdle); wIdle = 0; wArmed = true; wRising = false; wAccum = 0; wDir = 0; wEnvelope = 0; wPeak = 0; wCount = 0; wStepT = 0; wLastT = 0; wHasLast = false; }
  function onWheel(e){
    if(e.ctrlKey) return;
    e.preventDefault();
    if(flight) return;
    let dx = e.deltaX, dy = e.deltaY;
    if(e.deltaMode === 1){ dx *= 16; dy *= 16; } else if(e.deltaMode === 2){ dx *= innerWidth; dy *= innerHeight; }
    const delta = Math.abs(dx) > Math.abs(dy) * 1.25 ? dx : dy, mag = Math.abs(delta);
    const now = performance.now(), gap = wHasLast ? now - wLastT : Infinity;
    wLastT = now; wHasLast = true;
    clearTimeout(wIdle); wIdle = setTimeout(resetWheel, P.wheelIdleReset);
    const decayed = wEnvelope * (gap === Infinity ? 0 : Math.exp(-gap / P.wheelEnvelopeTau));
    if(mag < P.wheelNoiseFloor){ wEnvelope = decayed; return; }
    const rising = mag > decayed * P.wheelRiseFactor;
    wEnvelope = Math.max(mag, decayed);
    if(!wArmed){
      wCount++; wPeak = Math.max(wPeak, mag);
      const since = now - wStepT;
      const paused = gap >= P.wheelPauseGap;
      const tick = gap >= P.wheelTickGap && wCount <= 2 && since >= P.wheelMinStepTick && mag >= wPeak * P.wheelTickRatio;
      const flick = rising && since >= P.wheelMinStepFlick;
      const sustain = since >= P.wheelSustainDelay && wEnvelope >= wPeak * P.wheelSustainRatio;
      if(!(paused || tick || flick || sustain)) return;
      wArmed = true; wAccum = 0; wDir = 0; wRising = !(paused || tick || sustain);
    }
    const dir = delta > 0 ? 1 : -1;
    if(dir !== wDir){ wAccum = 0; wDir = dir; }
    wAccum += Math.min(wRising ? Math.max(0, mag - decayed) : mag, P.wheelEventCap);
    if(wAccum < P.wheelStepThreshold) return;
    wArmed = false; wAccum = 0; wStepT = now; wCount = 0; wPeak = mag;
    keyboardNav = false;
    const from = currentTarget(), to = clamp(from + dir, 0, COUNT - 1);
    if(to !== from) goTo(to, 'wheel');
  }

  function onKey(e){
    if(flight || e.defaultPrevented || e.altKey || nav.dataset.dropdown === 'open' || lbOpen) return;
    const a = document.activeElement;
    if(['INPUT', 'TEXTAREA', 'SELECT'].includes(a?.tagName) || a?.isContentEditable) return;
    const inside = hero.contains(a) || a === document.body || !a;
    if(!inside) return;
    if((e.metaKey || e.ctrlKey) && e.key !== 'Enter') return;
    if(e.key === 'Enter'){ e.preventDefault(); open(W, e); return; }
    if(e.key === ' ' || e.key === 'Spacebar'){ e.preventDefault(); flip(W); return; }
    let to = -1;
    if(e.key === 'ArrowRight') to = currentTarget() + 1;
    else if(e.key === 'ArrowLeft') to = currentTarget() - 1;
    else if(e.key === 'Home') to = 0;
    else if(e.key === 'End') to = COUNT - 1;
    else return;
    e.preventDefault(); resetWheel(); keyboardNav = true; goTo(to, 'key');
  }

  /* ── 转场：正前方的盘按下—回弹—侧转缩走（原站 detail out），回来时再飞入（detail in） ── */
  function flightOut(onHandOver){
    flight = true; dragVel = spring = flowVel = 0; gsap.killTweensOf(tweenL); gsap.killTweensOf(Gf); goSeq++;
    hovered = -1; keyboardNav = false; Gf.inbound = false;
    flow.forceOut();
    const f = activeIdx(), from = clamp(L, -.05, COUNT - .95), dist = Math.abs(from - f);
    const settle = reduce || dist < .002 ? 0 : clamp(.12 + dist * .25, .12, .4);
    const d = discs[f]; d?.resetTween?.kill(); if(d) d.resetTween = null;
    if(reduce){ Gf.others = 0; Gf.active = .001; L = f; kick(3); onHandOver?.(); return Promise.resolve(); }
    return new Promise((resolve) => {
      let handed = false; const hand = () => { if(!handed){ handed = true; try{ onHandOver?.(); }catch(err){} } };
      const outD = .55, pressS = .94, pressT = .12, springS = 1.015, springT = .16;
      const tl = gsap.timeline({ onUpdate: () => kick(1), onComplete: () => { hand(); resolve(); } });
      if(settle > 0){ tweenL.value = from; tl.to(tweenL, { value:f, duration:settle, ease:'power2.out', onUpdate: () => { L = tweenL.value; } }, 0); }
      const t0 = settle * .6;
      tl.to(Gf, { active:pressS, duration:pressT, ease:'power2.out' }, t0);
      tl.to(Gf, { active:springS, duration:springT, ease:'power2.out' }, t0 + pressT);
      tl.to(Gf, { others:0, duration:outD, ease:'none' }, t0 + pressT);
      const t1 = t0 + pressT + springT;
      tl.to(Gf, { active:.001, duration:outD, ease:'power2.in' }, t1);
      if(d){ const k = Math.ceil((d.spinY + Math.PI / 2 - Math.PI / 2) / Math.PI - 1e-6); tl.to(d, { spinY:Math.PI / 2 + k * Math.PI, spinX:0, duration:outD, ease:'power2.in' }, t1); }
      tl.call(hand, null, t1 + outD * .55);
      kick(3);
    });
  }
  function flightIn(duration = 1){
    flight = true; gsap.killTweensOf(Gf);
    const d = discs[activeIdx()];
    Gf.inbound = true; Gf.others = 0; Gf.active = .001;
    if(d){ d.spinY = 0; d.spinX = 0; }
    discs.forEach((x) => { x.fresh = true; });
    layout(1, true); renderer.render(scene, camera);
    const done = () => { Gf.others = 1; Gf.active = 1; Gf.inbound = false; flight = false; flow.release(activeIdx()); kick(3); };
    if(reduce){ done(); return Promise.resolve(); }
    return new Promise((resolve) => {
      const tl = gsap.timeline({ onUpdate: () => kick(1), onComplete: () => { done(); resolve(); } });
      tl.to(Gf, { active:1, duration, ease:glide }, 0);
      tl.to(Gf, { others:1, duration:duration * .85, ease:'none' }, duration * .1);
      tl.call(() => { flight = false; flow.release(activeIdx()); }, null, duration * .9);
      kick(3);
    });
  }

  /* 盘在屏幕上的位置（给灯箱从盘面展开用） */
  const wp = new THREE.Vector3(), wx = new THREE.Vector3(), ws = new THREE.Vector3(), cx = new THREE.Vector3();
  function discScreen(i){
    const d = discs[i], r = renderer.domElement.getBoundingClientRect();
    d.group.updateWorldMatrix(true, false); camera.updateMatrixWorld();
    d.group.getWorldPosition(wp); d.group.getWorldScale(ws);
    cx.setFromMatrixColumn(camera.matrixWorld, 0).normalize();
    wx.copy(wp).addScaledVector(cx, ws.x);
    const a = wp.clone().project(camera), b = wx.clone().project(camera);
    const px = (v) => ({ x:(v.x * .5 + .5) * r.width + r.left, y:(-v.y * .5 + .5) * r.height + r.top });
    const pa = px(a), pb = px(b);
    return { x:pa.x, y:pa.y, r:Math.abs(pb.x - pa.x) };
  }

  function open(i, e){
    const it = ITEMS[i]; if(!it) return;
    if(e && (e.metaKey || e.ctrlKey)){ window.open(it.href, '_blank', 'noopener'); return; }
    if(it.vimeo){ openTrailer(i); return; }
    flightOut(() => { window.location.href = it.href; });
  }

  /* ── 事件 ── */
  hero.addEventListener('pointerdown', onDown, { capture:true });
  hero.addEventListener('pointermove', onHoverMove, { passive:true });
  hero.addEventListener('pointerleave', () => { if(!pointerDown){ hovered = -1; kick(); } });
  hero.addEventListener('click', onClick, { capture:true });
  hero.addEventListener('wheel', onWheel, { passive:false, capture:true });
  window.addEventListener('keydown', onKey);
  window.addEventListener('blur', () => { resetWheel(); endPointer(true); keyboardNav = false; kick(); });
  document.addEventListener('visibilitychange', () => { if(!document.hidden) kick(3); });
  new ResizeObserver(() => resize()).observe(wrap);
  touchLayoutMQ.addEventListener('change', () => { fitTouch(); kick(2); });
  renderer.domElement.addEventListener('webglcontextlost', (e) => e.preventDefault());

  resize();
  layout(1, true);
  setActive(0);
  await Promise.race([Promise.all([0, 1, 2].map(loadArt)), new Promise((r) => setTimeout(r, 2500))]);
  if(typeof renderer.compileAsync === 'function'){
    await Promise.race([renderer.compileAsync(scene, camera).catch(() => {}), new Promise((r) => setTimeout(r, 1500))]);
  }
  ready = true;
  return {
    index: () => W,
    goTo,
    canReveal: () => ready && !flight,
    flightOut, flightIn, discScreen,
    intro(){ return flightIn(1.05); },
    renderNow(){ layout(1, true); renderer.render(scene, camera); },
  };
}

/* ─────────────── 预告片灯箱 ─────────────── */
const lb = $('lb'), plate = $('lbPlate'), stage = $('lbStage');
let lbOpen = false, player = null, lbItem = -1, duration = 0, muted = true, paused = false, volume = 1;
const lbUI = () => lb.querySelectorAll('.lb-ui');
const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
let vimeoReady = null;
function loadVimeoAPI(){
  if(window.Vimeo) return Promise.resolve();
  if(vimeoReady) return vimeoReady;
  vimeoReady = new Promise((res) => { const s = document.createElement('script'); s.src = 'https://player.vimeo.com/api/player.js'; s.async = true; s.onload = res; s.onerror = res; document.head.appendChild(s); });
  return vimeoReady;
}
function setMuted(m){
  muted = m; lb.dataset.muted = String(m);
  $('lbSoundWave').style.opacity = m ? '.2' : '1';
  $('lbSound').querySelector('.txt').textContent = m ? 'Sound' : 'Mute';
  if(player){ player.setMuted(m).catch(() => {}); if(!m) player.setVolume(volume).catch(() => {}); }
}
function setPaused(p){
  paused = p;
  $('lbPlay').querySelector('.txt').textContent = p ? 'Play' : 'Pause';
  $('lbPlay').setAttribute('aria-label', p ? 'Play' : 'Pause');
  $('lbPlayIco').setAttribute('d', p ? 'M7 4.5v15l12-7.5z' : 'M7 5h3.5v14H7zM13.5 5H17v14h-3.5z');
  $('lbCenter').innerHTML = p ? '<path d="M7 4.5v15l12-7.5z" fill="#fff"/>' : '<rect x="6" y="4" width="4" height="16" rx="1" fill="#fff"/><rect x="14" y="4" width="4" height="16" rx="1" fill="#fff"/>';
  if(player) (p ? player.pause() : player.play()).catch(() => {});
}
async function openTrailer(i){
  if(lbOpen) return;
  const it = ITEMS[i]; lbOpen = true; lbItem = i;
  loadVimeoAPI();
  const meta = $('lbMeta'); meta.innerHTML = '';
  [['Type 类型', it.type], ['Date 日期', it.date], ['Venue 地点', it.venue.join(', ')]].forEach(([l, v]) => {
    const a = document.createElement('span'); a.className = 'subheading-xs'; a.textContent = l;
    const b = document.createElement('span'); b.className = 'paragraph-m'; b.textContent = v;
    meta.append(a, b);
  });
  $('lbProject').href = it.href;
  $('lbTime').textContent = '00:00 / 00:00'; $('lbProg').style.width = '0'; $('lbBuf').style.width = '0';
  setPaused(false); setMuted(true);
  const ds = gallery ? gallery.discScreen(i) : { x:innerWidth / 2, y:innerHeight / 2, r:Math.min(innerWidth, innerHeight) * .3 };
  const W0 = innerWidth, H0 = innerHeight;
  const from = `inset(${Math.max(0, ds.y - ds.r)}px ${Math.max(0, W0 - ds.x - ds.r)}px ${Math.max(0, H0 - ds.y - ds.r)}px ${Math.max(0, ds.x - ds.r)}px)`;
  lb.classList.add('is-open'); lb.setAttribute('aria-hidden', 'false');
  nav.classList.add('on-dark'); nav.classList.add('is-hidden');
  gsap.set(plate, { clipPath:from }); gsap.set(stage, { opacity:0 }); gsap.set(lbUI(), { opacity:0 });
  const flightP = gallery ? gallery.flightOut() : Promise.resolve();
  const frame = $('lbFrame');
  frame.innerHTML = `<iframe allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="${esc(it.title)} trailer"
    src="https://player.vimeo.com/video/${it.vimeo}?autoplay=1&muted=1&controls=0&playsinline=1&title=0&byline=0&portrait=0&dnt=1"></iframe>`;
  loadVimeoAPI().then(() => {
    if(!window.Vimeo || !lbOpen) return;
    player = new window.Vimeo.Player(frame.querySelector('iframe'));
    player.on('timeupdate', (d) => { duration = d.duration; $('lbTime').textContent = fmt(d.seconds) + ' / ' + fmt(d.duration); $('lbProg').style.width = (d.percent * 100) + '%'; $('lbTimeline').setAttribute('aria-valuenow', Math.round(d.percent * 100)); });
    player.on('progress', (d) => { $('lbBuf').style.width = (d.percent * 100) + '%'; });
    player.on('play', () => { if(paused) setPaused(false); });
    player.on('ended', () => setPaused(true));
    player.getDuration().then((d) => { duration = d; $('lbTime').textContent = '00:00 / ' + fmt(d); }).catch(() => {});
  });
  const dur = reduce ? 0 : .9;
  gsap.to(plate, { clipPath:'inset(0px 0px 0px 0px)', duration:dur, ease:glide, delay: reduce ? 0 : .12 });
  gsap.to(stage, { opacity:1, duration: reduce ? 0 : .5, delay: reduce ? 0 : .7 });
  gsap.to(lbUI(), { opacity:1, duration: reduce ? 0 : .5, delay: reduce ? 0 : .9, stagger: reduce ? 0 : .05 });
  await flightP;
  $('lbClose').focus({ preventScroll:true });
}
async function closeTrailer(){
  if(!lbOpen) return;
  lbOpen = false;
  if(document.fullscreenElement) document.exitFullscreen().catch(() => {});
  const ds = gallery ? gallery.discScreen(lbItem) : { x:innerWidth / 2, y:innerHeight / 2, r:40 };
  gsap.to(lbUI(), { opacity:0, duration: reduce ? 0 : .25 });
  gsap.to(stage, { opacity:0, duration: reduce ? 0 : .3 });
  const W0 = innerWidth, H0 = innerHeight, r = Math.max(24, ds.r);
  const to = `inset(${Math.max(0, ds.y - r)}px ${Math.max(0, W0 - ds.x - r)}px ${Math.max(0, H0 - ds.y - r)}px ${Math.max(0, ds.x - r)}px)`;
  const back = gallery ? gallery.flightIn(1) : Promise.resolve();
  await gsap.to(plate, { clipPath:to, opacity:0, duration: reduce ? 0 : .8, ease:glide, delay: reduce ? 0 : .15 });
  lb.classList.remove('is-open'); lb.setAttribute('aria-hidden', 'true'); gsap.set(plate, { opacity:1 });
  nav.classList.remove('on-dark', 'is-hidden');
  try{ player?.destroy(); }catch(e){}
  player = null; $('lbFrame').innerHTML = '';
  await back;
  hero.focus({ preventScroll:true });
}
$('lbClose').addEventListener('click', closeTrailer);
$('lbShield').addEventListener('click', () => setPaused(!paused));
$('lbPlay').addEventListener('click', () => setPaused(!paused));
$('lbUnmute').addEventListener('click', () => setMuted(false));
$('lbSound').addEventListener('click', () => setMuted(!muted));
$('lbMax').addEventListener('click', () => {
  if(document.fullscreenElement){ document.exitFullscreen().catch(() => {}); return; }
  if(lb.requestFullscreen) lb.requestFullscreen().catch(() => player?.requestFullscreen?.());
  else player?.requestFullscreen?.();
});
function seekFrom(e){
  const r = $('lbTimeline').getBoundingClientRect(), p = clamp((e.clientX - r.left) / r.width, 0, 1);
  if(player && duration) player.setCurrentTime(p * duration).catch(() => {});
}
$('lbTimeline').addEventListener('click', seekFrom);
$('lbVolume').addEventListener('click', (e) => {
  const r = $('lbVolume').getBoundingClientRect(); volume = clamp((e.clientX - r.left) / r.width, 0, 1);
  $('lbVolLvl').style.width = (volume * 100) + '%'; $('lbVolume').setAttribute('aria-valuenow', Math.round(volume * 100));
  setMuted(volume === 0);
});
document.addEventListener('keydown', (e) => {
  if(!lbOpen) return;
  if(e.key === 'Escape'){ e.preventDefault(); closeTrailer(); }
  else if(e.key === ' ' && !e.target.closest('button, a')){ e.preventDefault(); setPaused(!paused); }
});

/* ─────────────── 启动 ─────────────── */
function reveal(){
  html.classList.remove('is-loading');
  $('navList').querySelectorAll('li:not(.li-logo):not(.nav-loading-item)').forEach((li, k) => {
    if(reduce) return; li.classList.add('enter'); li.style.animationDelay = (k * .05) + 's';
  });
  sizeIndexLabel(); sizeDock();
}
(async function boot(){
  if(!gsap){ console.error('GSAP failed to load'); }
  measureTestimonials();
  addEventListener('resize', () => { clearTimeout(boot.t); boot.t = setTimeout(() => { measureTestimonials(); sizeDock(); sizeIndexLabel(); }, 150); });
  document.fonts?.ready?.then(() => { measureTestimonials(); sizeDock(); sizeIndexLabel(); });
  try{ gallery = await initGallery(); }catch(err){ console.error('Disc gallery failed to initialize:', err); gallery = null; }
  if(!gallery){
    html.classList.add('no-webgl');
    let i = 0;
    const show = () => { $('fallbackImg').src = ITEMS[i].img; };
    gallery = { index: () => i, canReveal: () => true, goTo: (n) => { i = clamp(n, 0, COUNT - 1); show(); flow.change(i); ddList.querySelectorAll('.dd-link').forEach((a, k) => a.setAttribute('aria-current', String(k === i))); },
                discScreen: () => ({ x:innerWidth / 2, y:innerHeight / 2, r:Math.min(innerWidth, innerHeight) * .3 }), flightOut: () => Promise.resolve(), flightIn: () => Promise.resolve() };
    show(); flow.init(0); reveal();
    hero.addEventListener('click', () => { const it = ITEMS[i]; if(it.vimeo) openTrailer(i); else location.href = it.href; });
    addEventListener('keydown', (e) => { if(e.key === 'ArrowRight') gallery.goTo(i + 1); if(e.key === 'ArrowLeft') gallery.goTo(i - 1); });
    return;
  }
  flow.init(0);
  reveal();
  if(!location.hash) hero.focus({ preventScroll:true });
  gallery.intro();
})();
/* 从作品页返回（浏览器前进后退缓存）时，光盘重新飞入 */
addEventListener('pageshow', (e) => { if(e.persisted && gallery?.flightIn) gallery.flightIn(1); });
