<head>
<meta charset="utf-8" />

<style>
  /* 字体：英 E / 中 Z / 数字 N（与 ABOUT 页一致） */
  @font-face{font-family:"EFont";src:url("../fonts/E.ttf") format("truetype");font-weight:400 700;font-style:normal;font-display:swap;}
  @font-face{font-family:"ZFont";src:url("assets/Z-career.woff2") format("woff2");font-weight:400 700;font-style:normal;font-display:block;}
  @font-face{font-family:"NFont";src:url("../fonts/N.ttf") format("truetype");font-weight:400 700;font-style:normal;font-display:swap;}

  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    background:#111;
    color:#fff;
    font-family:"ZFont","EFont","PingFang SC","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* ── 入口：整屏都是进入按钮 ── */
  .entry{
    position:fixed;
    inset:0;
    display:block;
    color:inherit;
    text-decoration:none;
    cursor:pointer;
  }

  /* ── 轮播：交叉淡入 + 缓慢推近 ── */
  .slides{position:absolute;inset:0;overflow:hidden;}
  .slide{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity 1.6s ease;
  }
  .slide img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transform:scale(1.02);
  }
  .slide.is-on{opacity:1;}
  .slide.is-on img{
    transform:scale(1.10);
    transition:transform 7s linear;
  }
  /* 压暗边缘，保证名字在任何图上都清晰 */
  .slides::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.28), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 62%, rgba(0,0,0,.42));
    pointer-events:none;
  }

  /* ── 名字 ── */
  .name{
    position:absolute;
    left:30px;
    bottom:26px;
    margin:0;
    line-height:.92;
    font-weight:700;
    text-shadow:0 1px 18px rgba(0,0,0,.25);
  }
  .name-zh{
    display:block;
    font-family:"ZFont","EFont",sans-serif;
    font-size:clamp(64px, 11vw, 168px);
    letter-spacing:.04em;
  }
  .name-en{
    display:block;
    margin-top:14px;
    font-family:"EFont","ZFont",sans-serif;
    font-size:clamp(24px, 3.2vw, 44px);
    letter-spacing:.14em;
  }

  /* ── 右上：进入 ── */
  .enter{
    position:absolute;
    top:22px;
    right:30px;
    font-family:"EFont","ZFont",sans-serif;
    font-size:28px;
    font-weight:700;
    letter-spacing:2.5px;
    line-height:1;
  }
  .entry:hover .enter,
  .entry:focus-visible .enter{text-decoration:underline;text-underline-offset:5px;}
  .entry:focus-visible{outline:none;}

  /* ── 右下：图说 + 计数 ── */
  .caption{
    position:absolute;
    right:30px;
    bottom:30px;
    text-align:right;
    font-family:"EFont","ZFont",sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:1.2px;
    line-height:1.6;
    max-width:40vw;
  }
  .count{font-family:"NFont","EFont",sans-serif;font-variant-numeric:tabular-nums;}

  @media (max-width:860px){
    .name{left:22px;bottom:84px;}
    .enter{top:18px;right:22px;font-size:18px;letter-spacing:1.5px;}
    .caption{left:22px;right:auto;bottom:28px;text-align:left;max-width:none;font-size:12px;}
  }

  @media (prefers-reduced-motion:reduce){
    .slide{transition:none;}
    .slide.is-on img{transform:scale(1.02);transition:none;}
  }
</style>
</head>

<body>
<a class="entry" href="news.html" aria-label="Enter 进入 — Yi Huang 黄熠">
  <div class="slides" id="slides" aria-hidden="true"></div>

  <h1 class="name">
    <span class="name-zh">黄熠</span>
    <span class="name-en">YI HUANG</span>
  </h1>

  <span class="enter">ENTER 进入</span>

  <span class="caption">
    <span id="cap"></span><br>
    <span class="count" id="count"></span>
  </span>
</a>

<script>
(function(){
  /* 轮播图：换图只改这里（图放在 career/assets/entry/，建议 2000px 长边 webp） */
  var SLIDES = [
    { src:'assets/entry/01.webp', cap:'As Fables Go By — 洋务运动, 2026' },
    { src:'assets/entry/02.webp', cap:'The Experience — 关中往事, 2025' },
    { src:'assets/entry/03.webp', cap:'Barbican, 2026' },
    { src:'assets/entry/04.webp', cap:'As Fables Go By — 洋务运动, 2026' },
    { src:'assets/entry/05.webp', cap:'Remote Fantasy — 情迷海南岛, 2024' },
    { src:'assets/entry/06.webp', cap:'Marseille — 晒后假日下, 2026' },
    { src:'assets/entry/07.webp', cap:'The Experience — 关中往事, 2025' },
    { src:'assets/entry/08.webp', cap:'Cambridge — 洋务时刻, 2026' },
    { src:'assets/entry/09.webp', cap:'Passing By, 2026' }
  ];
  var INTERVAL = 4200;

  var box = document.getElementById('slides');
  var cap = document.getElementById('cap');
  var count = document.getElementById('count');
  var nodes = [];

  function pad(n){ return (n < 10 ? '0' : '') + n; }

  function make(i){
    if(nodes[i]) return nodes[i];
    var d = document.createElement('div');
    d.className = 'slide';
    var img = document.createElement('img');
    img.alt = '';
    img.decoding = 'async';
    img.src = SLIDES[i].src;
    d.appendChild(img);
    box.appendChild(d);
    nodes[i] = d;
    return d;
  }

  var cur = -1;
  function show(i){
    var next = make(i);
    /* 预载下一张，避免切换时空白 */
    make((i + 1) % SLIDES.length);
    if(cur >= 0) nodes[cur].classList.remove('is-on');
    /* 强制回流，让推近动画从头开始 */
    void next.offsetWidth;
    next.classList.add('is-on');
    cap.textContent = SLIDES[i].cap;
    count.textContent = pad(i + 1) + ' / ' + pad(SLIDES.length);
    cur = i;
  }

  show(0);

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timer = setInterval(function(){ show((cur + 1) % SLIDES.length); }, reduce ? INTERVAL * 1.6 : INTERVAL);

  /* 标签页隐藏时暂停 */
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ clearInterval(timer); timer = null; }
    else if(!timer){ timer = setInterval(function(){ show((cur + 1) % SLIDES.length); }, INTERVAL); }
  });
})();
</script>
</body>
</html>
