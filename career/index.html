<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Yi Huang</title>
<meta name="description" content="Yi Huang — moving image, installation and text.">
<link rel="canonical" href="https://yihuang.art/career/">

<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-BPBFT1Q5SF');</script>
<link rel="preload" as="image" href="assets/entry/00.webp">

<style>
  :root{ --accent:#e4553b; }

  html,body{height:100%;margin:0;overflow:hidden;}
  body{background:#1a1414;}

  /* 整屏都是进入按钮 */
  .entry{position:fixed;inset:0;display:block;text-decoration:none;cursor:pointer;}

  /* 轮播：交叉淡入 + 缓慢推近 */
  .slides{position:absolute;inset:0;overflow:hidden;}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;}
  .slide img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.02);}
  .slide.is-on{opacity:1;}
  .slide.is-on img{transform:scale(1.08);transition:transform 7s linear;}

  /* 名字：橙红斜体衬线，两行，左侧出血 */
  .name{
    position:absolute;
    top:0;
    left:-.07em;
    margin:0;
    font-family:"Times New Roman",Times,"Liberation Serif","Nimbus Roman",serif;
    font-style:italic;
    font-weight:400;
    font-size:min(38.5vw, 44vh);
    line-height:.86;
    letter-spacing:-.02em;
    color:var(--accent);
    pointer-events:none;
  }
  .name span{display:block;}

  .copy{
    position:absolute;
    right:18px;
    bottom:18px;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    font-size:14px;
    color:#fff;
  }

  @media (prefers-reduced-motion:reduce){
    .slide{transition:none;}
    .slide.is-on img{transform:scale(1.02);transition:none;}
  }
</style>
</head>

<body>
<a class="entry" href="news-disc.html" aria-label="Yi Huang — enter">
  <div class="slides" id="slides" aria-hidden="true"></div>
  <h1 class="name"><span>Yi</span><span>Huang</span></h1>
  <span class="copy">© 2021-2026</span>
</a>

<script>
(function(){
  /* 轮播图：换图只改这里（图放在 career/assets/entry/，建议 2000px 长边 webp） */
  var SLIDES = [
    'assets/entry/00.webp',
    'assets/entry/01.webp',
    'assets/entry/02.webp',
    'assets/entry/03.webp',
    'assets/entry/04.webp',
    'assets/entry/05.webp',
    'assets/entry/06.webp',
    'assets/entry/07.webp',
    'assets/entry/08.webp'
  ];
  var INTERVAL = 4200;

  var box = document.getElementById('slides');
  var nodes = [];
  var cur = -1;

  function make(i){
    if(nodes[i]) return nodes[i];
    var d = document.createElement('div');
    d.className = 'slide';
    var img = document.createElement('img');
    img.alt = '';
    img.decoding = 'async';
    img.src = SLIDES[i];
    d.appendChild(img);
    box.appendChild(d);
    return (nodes[i] = d);
  }

  function show(i){
    var next = make(i);
    make((i + 1) % SLIDES.length);   /* 预载下一张 */
    if(cur >= 0) nodes[cur].classList.remove('is-on');
    void next.offsetWidth;           /* 让推近动画从头开始 */
    next.classList.add('is-on');
    cur = i;
  }

  function step(){ show((cur + 1) % SLIDES.length); }

  show(0);
  var timer = setInterval(step, INTERVAL);

  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ clearInterval(timer); timer = null; }
    else if(!timer){ timer = setInterval(step, INTERVAL); }
  });
})();
</script>
</body>
</html>
