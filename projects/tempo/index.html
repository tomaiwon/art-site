<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>半拍 Tempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500&text=%E5%8D%8A%E6%8B%8D&display=swap">
<style>
  /* Layout: one 16:9 film frame centred on black; titles and a quiet transport bar sit inside the frame. */
  :root {
    --void: #000;
    --frame: #050608;
    --title: #fbf8f2;
    --muted: rgba(251, 248, 242, 0.55);
    --hair: rgba(251, 248, 242, 0.22);
    --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --sans: "Jost", "Futura", "Helvetica Neue", Arial, sans-serif;
    --cjk: "Noto Serif SC", "Songti SC", "STSong", serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--void); color: var(--title); overflow: hidden; font-family: var(--sans); }
  .wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  .stage { position: relative; background: var(--frame); overflow: hidden; --u: 1px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .title {
    position: absolute; left: 0; right: 0; top: 0; height: 46.5%;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    pointer-events: none; text-align: center;
  }
  .big {
    font-family: var(--serif); font-weight: 600; font-size: calc(var(--u) * 7.6);
    letter-spacing: 0.015em; line-height: 1; margin: 0;
    text-shadow: 0 0 calc(var(--u) * 1.2) rgba(0, 0, 0, 0.35);
    white-space: nowrap;
  }
  .again { font-size: calc(var(--u) * 5); }
  .sub {
    font-family: var(--sans); font-size: calc(var(--u) * 1.25); letter-spacing: 0.14em;
    text-transform: uppercase; margin-top: calc(var(--u) * 0.9); color: var(--muted);
  }
  .end { height: 40%; }
  .end .cjk { font-family: var(--cjk); font-weight: 500; font-size: calc(var(--u) * 2.5); letter-spacing: 0.35em; padding-left: 0.35em; color: rgba(251,248,242,0.8); }
  .end .sub { font-size: calc(var(--u) * 0.95); letter-spacing: 0.3em; margin-top: calc(var(--u) * 0.5); }

  .card {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    background: radial-gradient(60% 50% at 50% 45%, rgba(0,0,0,0.15), rgba(0,0,0,0.55));
  }
  .card-inner { display: grid; gap: calc(var(--u) * 2.2); justify-items: center; transform: translateY(-12%); }
  .card .eyebrow { font-size: max(10px, calc(var(--u) * 1.3)); letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted); }
  .card h1 { font-family: var(--serif); font-weight: 500; font-size: max(22px, calc(var(--u) * 5.2)); margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
  .card h1 .cjk { font-family: var(--cjk); font-size: 0.62em; letter-spacing: 0.3em; margin-right: 0.4em; vertical-align: 0.12em; }
  .card p { margin: 0; font-size: max(11px, calc(var(--u) * 1.5)); color: var(--muted); letter-spacing: 0.04em; }
  .play {
    appearance: none; cursor: pointer; border: 1px solid var(--hair); background: rgba(255,255,255,0.06);
    color: var(--title); font-family: var(--sans); font-size: max(12px, calc(var(--u) * 1.6)); letter-spacing: 0.22em;
    text-transform: uppercase; padding: calc(var(--u) * 1.3) calc(var(--u) * 3.2); border-radius: 999px;
    display: inline-flex; align-items: center; gap: 0.8em; transition: background .2s, border-color .2s;
  }
  .play:hover { background: rgba(255,255,255,0.14); border-color: var(--muted); }
  .play svg { width: 0.85em; height: 0.85em; fill: currentColor; }
  button:focus-visible { outline: 2px solid var(--title); outline-offset: 3px; }

  .bar {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; gap: 14px;
    padding: 10px max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px));
    background: linear-gradient(transparent, rgba(0,0,0,0.55));
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
    transition: opacity .4s; font-variant-numeric: tabular-nums;
  }
  .bar.idle { opacity: 0; }
  .bar button {
    appearance: none; background: none; border: 0; color: var(--title); cursor: pointer; padding: 4px;
    font: inherit; letter-spacing: inherit; display: inline-flex; align-items: center; gap: 6px;
  }
  .bar svg { width: 14px; height: 14px; fill: currentColor; }
  .track { flex: 1; height: 1px; background: var(--hair); position: relative; min-width: 40px; }
  .track i { position: absolute; left: 0; top: -0.5px; height: 2px; background: var(--title); width: 0; }
  @media (max-width: 560px) { .bar .take { display: none; } }
  @media (prefers-reduced-motion: reduce) { .bar { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="Thirty-second title sequence: textures cut to a beat beneath a single arc of light."></canvas>

    <div class="title" id="t-main" hidden><p class="big" id="t-text">THE SAME</p></div>
    <div class="title" id="t-again" hidden><p class="big again">AGAIN.</p><div class="sub">A study of difference</div></div>
    <div class="title end" id="t-end" hidden><div class="cjk">半拍</div><div class="sub">Tempo</div></div>

    <div class="card" id="card">
      <div class="card-inner">
        <div class="eyebrow">A study of difference · 0:30</div>
        <h1><span class="cjk">半拍</span>Tempo</h1>
        <button class="play" id="play"><svg viewBox="0 0 10 10"><path d="M1 0l9 5-9 5z"/></svg>Play with sound</button>
        <p id="card-note">Every take is cut differently.</p>
      </div>
    </div>

    <div class="bar" id="bar" hidden>
      <button id="pp" aria-label="Pause"><svg viewBox="0 0 10 10" id="pp-ico"><path d="M1 0h3v10H1zM6 0h3v10H6z"/></svg></button>
      <span id="tc">00:00</span>
      <div class="track"><i id="prog"></i></div>
      <span class="take" id="take">Take 01</span>
      <button id="snd" aria-label="Mute">Sound on</button>
      <button id="again">Recut</button>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------- shader
const FRAG = `
precision highp float;
uniform vec2 uRes; uniform float uT, uLocal, uSeed, uArc, uFade, uHi;
uniform int uScene;
float px;
const vec3 INK = vec3(.16,.12,.09);
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+1.),f.x), f.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*vn(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s/.97; }
vec3 vor(vec2 p){ vec2 i=floor(p), f=fract(p); float d1=8., d2=8., id=0.;
  for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){ vec2 g=vec2(float(x),float(y));
    vec2 o=vec2(h21(i+g), h21(i+g+17.3)); vec2 r=g+o-f; float d=dot(r,r);
    if(d<d1){ d2=d1; d1=d; id=h21(i+g+3.1); } else if(d<d2) d2=d; }
  return vec3(sqrt(d1), sqrt(d2), id); }
float ln(float d, float w){ return 1.-smoothstep(w, w+1.5*px, abs(d)); }
float angLine(float a, float stepDeg, float r, float wpx){ // radial line every stepDeg
  float u = a*57.29578/stepDeg; float aw = px/max(r,1e-3)*57.29578/stepDeg;
  return 1.-smoothstep(aw*wpx, aw*(wpx+1.5), abs(fract(u+.5)-.5)); }
vec3 parchment(vec2 q, float s){
  float n=fbm(q*3.+s*10.), st=fbm(q*1.2+s*7.);
  vec3 c=mix(vec3(.87,.79,.62), vec3(.72,.58,.38), n*.85);
  c=mix(c, vec3(.58,.43,.26), smoothstep(.55,.85,st)*.45);
  return c*(.93+.07*vn(q*260.)); }
float script(vec2 q, float rowH){
  float row=floor(q.y/rowH), yy=fract(q.y/rowH);
  float word=step(.4, vn(vec2(q.x*9., row*3.7)));
  float stroke=smoothstep(.58,.85, vn(vec2(q.x*150., yy*6.+row*11.)));
  return word*stroke*smoothstep(.15,.3,yy)*smoothstep(.85,.62,yy); }

vec3 sVinyl(vec2 p, float t, float s){
  vec2 c=vec2(-.35+.3*s, -1.7); vec2 d=p-c; float r=length(d); float a=atan(d.y,d.x);
  float g=sin(r*1100.)*.5+.5;
  float gap=smoothstep(.0,.03, abs(fract(r*6.+s)-.5)-.44);
  float sheen=exp(-pow((a-1.3-.04*t+.2*s)*5.,2.));
  vec3 col=vec3(.03)+vec3(.05)*g + vec3(.32)*sheen*(.35+.65*g);
  col*=mix(.45,1.,gap);
  col+=vec3(.7)*step(.9965, h21(floor(rot(.02*t)*p*uRes.y*.5)));
  return col; }
vec3 sMap(vec2 p, float t, float s){
  vec2 q=p*.9+vec2(s*5.,s*3.)+vec2(t*.02,t*.006);
  vec3 c=parchment(q,s);
  float m=fbm(q*1.8+s*2.)+(q.x-s*5.)*.3;
  float land=smoothstep(.515,.53,m);
  c=mix(c, c*.84, land);
  float hz=land*smoothstep(.62,.53,m)*step(.55, fract((q.x+q.y)*230.));
  c=mix(c, INK, hz*.35);
  c=mix(c, INK, (1.-smoothstep(.0,.007,abs(m-.523)))*.85);
  float gl=max(ln((fract(q.x*2.2)-.5)/2.2, .0006), ln((fract(q.y*2.2)-.5)/2.2, .0006));
  c=mix(c, INK, gl*.45);
  c=mix(c, INK, script(q,.034)*(1.-land*.7)*.85);
  if(s>.5){ float r=length(q-vec2(s*5.+.35, s*3.-.08)); // engraved disc
    float disc=1.-smoothstep(.17,.172,r); c=mix(c, INK, disc*step(.5,fract(r*160.))*.7); c=mix(c,INK,ln(r-.172,.0008)); }
  return c; }
vec3 sCD(vec2 p, float t, float s){
  vec2 q=rot(.62+.2*s)*p + vec2(t*.03,0.);
  float f=fbm(q*vec2(1.,6.)+s);
  float v=q.y*5.+f*.6;
  vec3 film=.5+.5*cos(6.2832*(fract(v*1.3)*1.4+vec3(0.,.33,.67)));
  vec3 col=mix(vec3(.02,.12,.22), film*.85, .65)*(.55+.45*sin(v*6.2832));
  float edge=exp(-abs(fract(v)-.5)*90.);
  col+=vec3(.9)*edge*.6;
  col+=vec3(1.)*step(.985, vn(vec2(q.x*40., floor(v)*7.)))*edge*1.5;
  return col; }
vec3 sOcean(vec2 p, float t, float s){
  vec2 q=p+vec2(t*.03+s,0.);
  float h=fbm(vec2(q.x*4.,q.y*12.)+vec2(t*.3,0.));
  float rip=sin(q.y*90.+h*14.)*.5+.5;
  vec3 c=vec3(.13,.14,.15)+vec3(.13)*h+vec3(.05)*rip;
  float m=smoothstep(.42,.0, length((p-vec2(-.38+.2*s,-.12))*vec2(1.,1.5)));
  float fm=fbm(q*7.+vec2(0.,t*.25))*.7+fbm(q*vec2(26.,40.)-t*.2)*.3;
  float foam=smoothstep(.62,.8, fm+m*.55-.12);
  float lace=smoothstep(.55,.62, fm+m*.45-.1)*(1.-foam)*.35;
  return mix(c, vec3(.9)*(.85+.15*fm), max(foam,lace)); }
vec3 sLeather(vec2 p, float t, float s){
  vec2 q=p*1.1+vec2(s*4.,t*.01);
  vec3 v=vor(q*3.5+fbm(q*2.)*.3);
  float crack=1.-smoothstep(.0,.03,v.y-v.x);
  vec3 c=vec3(.40,.055,.055)*(.75+.45*fbm(q*40.))*(.9+.2*v.z);
  c=mix(c, vec3(.78,.38,.33), crack*.8);
  vec3 v2=vor(q*3.5+fbm(q*2.)*.3+vec2(.004,-.004));
  c*=1.-.45*(1.-smoothstep(.0,.03,v2.y-v2.x))*(1.-crack);
  return c; }
vec3 sPaper(vec2 p, float t, float s){ return vec3(.9,.87,.82)*(.93+.07*fbm(p*50.+s)); }
vec3 bar(float i){
  if(i<1.) return vec3(.75); if(i<2.) return vec3(.82,.8,.12); if(i<3.) return vec3(.1,.74,.78);
  if(i<4.) return vec3(.12,.7,.16); if(i<5.) return vec3(.76,.1,.76); if(i<6.) return vec3(.8,.08,.1); return vec3(.08,.12,.76); }
vec3 sTV(vec2 p, float t, float s){
  vec2 w=p*(1.-.02*t); w*=1.+.09*dot(w,w);
  vec2 a=abs(w)-vec2(.78,.48); float box=length(max(a+.07,0.))-.07;
  float bx=(w.x+.78)/1.56; vec3 c=bar(floor(clamp(bx,0.,.999)*7.));
  float band=smoothstep(.2,.04,abs(w.y+.01));
  float rnd=h21(vec2(floor(w.y*240.), floor(uT*24.)));
  float streak=step(.5,rnd)*band;
  c=mix(c, vec3(.9)*(.7+.3*h21(vec2(floor(w.x*80.),floor(w.y*240.)))), streak*.85);
  c*=.86+.14*sin(w.y*1100.);
  c*=1.-.35*dot(w,w);
  vec3 bez=vec3(.035)+vec3(.12)*exp(-abs(box)*80.);
  return mix(c, bez, smoothstep(-px,px,box)); }
vec2 leaf(vec2 q, vec2 o, float ang, float L){
  vec2 l=rot(ang)*(q-o)/L; float x=l.x, y=l.y;
  float w=.33*pow(max(sin(3.1416*clamp(x,0.,1.)),0.),.8)*(1.-.3*x);
  w+=.03*abs(fract(x*13.)-.5)*step(.05,x);
  float m=step(abs(y),w)*step(0.,x)*step(x,1.);
  m=max(m, step(-.28,x)*step(x,0.)*step(abs(y),.012));
  float vein=max(1.-smoothstep(.004,.009,abs(y)), (1.-smoothstep(.03,.06,abs(fract(x*7.-abs(y)*4.)-.5)))*step(abs(y),w*.85));
  return vec2(m, vein*m); }
vec3 sLeaf(vec2 p, float t, float s){
  vec2 q=p+vec2(t*.015,0.);
  vec3 c=vec3(.78,.86,.88)*(.95+.05*fbm(q*20.));
  vec3 dark=vec3(.15,.33,.5);
  for(int i=0;i<3;i++){ float fi=float(i);
    vec2 lf=leaf(q, vec2(-.55+fi*.55+.15*s, -.55+.12*fi), 1.95-fi*.5+s*.4, .75+.1*fi);
    c=mix(c, c*mix(dark/.78, vec3(1.), .25), lf.x*.85);
    c=mix(c, vec3(.45,.62,.74), lf.y*.55); }
  return c; }
vec3 sProt(vec2 p, float t, float s){
  vec2 q=p+vec2(s*.25+t*.02, 0.); vec3 c=parchment(q*1.4,s);
  vec2 o=vec2(0.,-.8); vec2 d=q-o; float r=length(d), a=atan(d.y,d.x);
  float k=0.;
  k=max(k, ln(r-.55,.0008)); k=max(k, ln(r-.585,.0007)); k=max(k, ln(r-.72,.001)); k=max(k, ln(r-.74,.0006));
  k=max(k, angLine(a,2.,r,.5)*step(.585,r)*step(r,.62));
  k=max(k, angLine(a,10.,r,.6)*step(.585,r)*step(r,.66));
  k=max(k, angLine(a,30.,r,.6)*step(r,.72));
  return mix(c, INK, k*.9); }
vec3 sCompass(vec2 p, float t, float s){
  vec2 q=p*(1.+.03*t); vec3 c=parchment(q*1.3+s,s);
  vec2 o=vec2(.04+.1*s,-.03); vec2 d=q-o; float r=length(d), a=atan(d.y,d.x);
  float k=angLine(a,7.5,r,.5)*smoothstep(.01,.03,r);
  for(int i=1;i<4;i++) k=max(k, ln(r-.16*float(i),.0007));
  vec2 o2=vec2(-1.6,-.9); k=max(k, ln(length(q-o2)-1.75,.0012)); k=max(k, ln(length(q-o2)-1.78,.0007));
  k=max(k, script(q+vec2(s,0.),.05)*step(.5,fract(a*1.1))*.8);
  return mix(c, INK, k*.85); }
vec3 sSun(vec2 p, float t, float s){
  vec2 q=p*(1.+.03*t); vec3 c=parchment(q*1.2+s,s);
  vec2 o=vec2(.08*s,.12); vec2 d=q-o; float r=length(d), a=atan(d.y,d.x);
  float k=angLine(a,3.,r,.6+1.5*step(.5,fract(a*57.3/6.)))*step(.08,r)*step(0.,d.y+.05);
  float plat=step(q.y,-.04)*step(-.33,q.y)*step(abs(q.x),.62-.4*(q.y+.04));
  k=max(k, plat*step(.45, fract(q.y*140.)));
  k=max(k, step(abs(q.y-.16),.035)*step(abs(q.x),.13));
  return mix(c, INK*.8, k*.9); }
vec3 sWood(vec2 p, float t, float s){
  vec2 q=p+vec2(t*.025+s*3.,0.);
  float w=q.y*38.+fbm(q*vec2(1.5,7.)+s)*7.;
  float g=abs(fract(w)-.5);
  vec3 c=mix(vec3(.84,.79,.7), vec3(.7,.64,.55), fbm(q*vec2(2.,30.)));
  c=mix(c, vec3(.18,.15,.12), (1.-smoothstep(.02,.09+.05*vn(q*20.),g))*.85);
  return c; }
vec3 sRings(vec2 p, float t, float s){
  vec2 q=p*(1.+.04*t); vec2 o=vec2(.35*s-.15,-.55);
  float r=length(q-o)+fbm(q*3.+s)*.06;
  float g=abs(fract(r*48.)-.5);
  vec3 c=vec3(.86,.83,.77)*(.93+.07*fbm(q*30.));
  return mix(c, vec3(.22,.2,.18), (1.-smoothstep(.06,.16,g))*.8); }
vec3 dome(vec2 p, vec3 top, vec3 c1, vec3 c2, float yTop, float rad, float jag){
  vec2 c=vec2(0., yTop-rad); float r=length(p-c);
  float d=r-rad-jag*(fbm(vec2(atan(p.y-c.y,p.x-c.x)*120., 1.))-.5);
  vec3 inside=mix(c1, c2, clamp(-d/.35,0.,1.));
  inside+=vec3(.25)*exp(-pow((p.x+.25)*3.,2.))*exp(d/.05)*.6;
  inside+=vec3(1.)*exp(-abs(d)/.003)*.18;
  return mix(top, inside, smoothstep(px,-px,d)); }
vec3 speckle(vec2 p, vec3 base, float amt){ return base*(.7+.6*fbm(p*25.))+vec3(amt)*step(.993,h21(floor(p*uRes.y*.35))); }

vec3 scene(int sc, vec2 p, float t, float s){
  if(sc==0) return vec3(0.);
  if(sc==1) return sVinyl(p,t,s);
  if(sc==2) return sMap(p,t,s);
  if(sc==3) return sCD(p,t,s);
  if(sc==4) return sOcean(p,t,s);
  if(sc==5) return sLeather(p,t,s);
  if(sc==6) return sPaper(p,t,s);
  if(sc==7) return sTV(p,t,s);
  if(sc==8) return sLeaf(p,t,s);
  if(sc==9) return sProt(p,t,s);
  if(sc==10) return sCompass(p,t,s);
  if(sc==11) return sSun(p,t,s);
  if(sc==12) return sWood(p,t,s);
  if(sc==13) return sRings(p,t,s);
  if(sc==14) return dome(p, speckle(p+s,vec3(.11,.07,.05),.3), vec3(.72,.12,.06), vec3(.32,.02,.02), -.1+.04*s, 1.6, 0.);
  if(sc==15) return dome(p, parchment(p*2.+s,s)*.95, vec3(.86,.2,.6), vec3(.5,.04,.34), -.08, 1.9, 0.);
  if(sc==16){ vec2 q=p*1.2+s*3.+vec2(t*.04,0.); vec3 v=vor(q*4.5+fbm(q*3.)*.5);
    float blob=smoothstep(.5,.15,v.x); return mix(vec3(.02,.12,.3), vec3(.42,.7,.95)*(.7+.3*fbm(q*15.)), blob); }
  if(sc==17){ float r=length(p-vec2(.05*s,-.05)); float rings=sin(r*70.+s*6.)*.5+.5;
    vec3 c=vec3(.02,.025,.035)+vec3(.12,.14,.17)*rings*smoothstep(.6,.1,r);
    c+=vec3(.7)*exp(-pow((r-.42)*60.,2.))*exp(-pow((p.x-.1)*4.,2.)); return c; }
  if(sc==18){ vec3 top=vec3(.03); vec3 d=dome(p, top, vec3(.78,.62,.4), vec3(.55,.4,.22), -.06, 1.5, 0.);
    float in1=step(p.y, -.07-.0*p.x); d=mix(d, d*.6, in1*step(.997,h21(floor(p*uRes.y*.4))));
    d=mix(d, vec3(.25,.12,.08), in1*ln(p.y+.12+.03*sin(p.x*20.+s*9.),.0012)*.8); return d; }
  if(sc==19){ vec2 q=p*1.1+s*2.; vec3 v=vor(q*3.); float ring=1.-smoothstep(.0,.025,abs(v.x-(.3+.15*v.z)));
    vec3 top=vec3(.02,.07,.33)*(.8+.4*fbm(q*4.))+vec3(.5,.65,1.)*ring*.5;
    return dome(p, top, vec3(1.,.62,.12), vec3(.9,.14,.04), -.14, 1.7, 0.); }
  if(sc==20){ vec2 q=p*1.2+s*3.+vec2(0.,t*.03); vec3 v=vor(q*2.6); float glow=smoothstep(.38,.0,v.x)*step(.5,v.z);
    vec3 c=vec3(.13,.045,.02)*(.7+.6*fbm(q*8.)); c+=vec3(1.,.48,.12)*glow*(.6+.8*fbm(q*14.)); c+=vec3(1.,.9,.7)*pow(glow,4.)*.8; return c; }
  if(sc==21){ vec2 q=p+s*4.; vec3 c=vec3(.5,.5,.48)*(.75+.5*fbm(q*9.))*(.9+.1*vn(q*200.));
    float y=p.y+.01-(fbm(vec2(q.x*7.,s))-.5)*.08; c*=1.-.8*ln(y,.003); c+=vec3(.25)*ln(y+.006,.0015); return c; }
  if(sc==22){ vec2 q=p*1.2+s*3.; vec3 v=vor(q*6.); float r=.32+.12*v.z;
    vec3 c=vec3(.55,.76,.62)*(.9+.1*fbm(q*20.));
    c=mix(c, vec3(.86,.26,.5), smoothstep(r,r-.04,v.x));
    c=mix(c, vec3(.42,.04,.2), (1.-smoothstep(.0,.04,abs(v.x-r*.55)))*step(v.x,r)); return c; }
  if(sc==23){ vec2 q=p*1.1+s*3.+vec2(t*.03,0.); vec3 v=vor(q*7.);
    vec3 c=vec3(.88,.18,.58)*(.85+.3*fbm(q*6.)); c+=vec3(.5,.2,.35)*(1.-smoothstep(.0,.05,abs(v.x-.33)));
    c+=vec3(1.)*step(.9,v.z)*exp(-v.x*20.)*.5; return c; }
  if(sc==24){ vec3 top=speckle(p+s,vec3(.1,.035,.03),.5);
    return dome(p, top, vec3(.62,.14,.07), vec3(.2,.03,.02), -.3, 1.4, .06); }
  if(sc==25){ vec3 top=mix(vec3(.8,.34,.08), vec3(.55,.18,.03), smoothstep(-.1,.5,p.y));
    vec3 d=dome(p, top, vec3(.75,.38,.12), vec3(.5,.18,.04), -.05, 2.2, 0.);
    return d*(.9+.15*fbm(p*12.+s)); }
  if(sc==26){ vec2 q=p*1.3+s*3.; float n=abs(fbm(q*5.)-.5); float n2=abs(fbm(q*11.+3.)-.5);
    float fib=max(1.-smoothstep(.0,.035,n), (1.-smoothstep(.0,.03,n2))*.6);
    return vec3(.08)+vec3(.75)*fib*(.4+.6*fbm(q*25.))+vec3(.18)*fbm(q*40.); }
  if(sc==27) return vec3(.84,.08,.06)*(1.-.25*length(p));
  if(sc==28){ return vec3(0.); }
  if(sc==29) return vec3(0.);
  if(sc==30){ vec2 q=p*1.1+vec2(s*3.,t*.01); vec3 c=vec3(.88,.84,.72)*(.92+.08*fbm(q*25.));
    float k=max(ln((fract(q.x*3.3)-.5)/3.3,.0008), ln((fract(q.y*14.)-.5)/14.,.0005)*.5);
    k=max(k, script(rot(.08)*q,.07));
    k=max(k, ln(fract(q.x*1.6+q.y*.4)-.5,.002)*step(.6,vn(q*4.)));
    return mix(c, vec3(.2,.15,.1), k*.85); }
  if(sc==31){ vec2 q=p*1.2+s*3.; vec3 v=vor(q*16.);
    vec3 crust=vec3(.78,.52,.26)*(.8+.4*fbm(q*10.));
    crust=mix(crust, vec3(.3,.15,.06), smoothstep(.3,.1,v.x)*step(.6,v.z));
    return dome(p, vec3(.05,.03,.02), crust, crust*.7, -.02, 1.8, .015); }
  return vec3(0.); }

void main(){
  px=1./uRes.y;
  vec2 p=(gl_FragCoord.xy-.5*uRes)/uRes.y;
  vec3 col=scene(uScene, p, uLocal, uSeed);

  float R=2.47, top=-.012; vec2 C=vec2(0., top-R); float d=length(p-C)-R;
  float prof=.32+.68*exp(-pow((p.x-uHi)/.5,2.));
  if(uScene==28){ // the limb of a blue world
    vec3 sky=vec3(.0,.012,.04)+vec3(.02,.07,.2)*exp(-max(d,0.)/.18);
    vec3 ground=vec3(.004,.016,.06)+vec3(.03,.15,.45)*exp(d/.07)*prof+vec3(.01,.06,.2)*exp(d/.3);
    col=mix(sky, ground, smoothstep(px,-px,d));
    col+=vec3(.35,.6,1.)*exp(-abs(d)/.012)*.35*prof;
  }
  if(uScene==29){ col=vec3(.012)*exp(d/.4)*step(d,0.)+vec3(.06)*exp(-abs(d)/.03)*prof; }
  if(uScene==6){
    float rough=(vn(p*vec2(260.,30.))-.5)*.0016;
    float blue=1.-smoothstep(.0011,.0022,abs(d+rough-.0075));
    float red=1.-smoothstep(.0011,.0022,abs(d+rough+.0005));
    float tex=.65+.35*vn(p*700.);
    col=mix(col, vec3(.15,.25,.78), blue*tex);
    col=mix(col, vec3(.86,.1,.12), red*tex);
  }
  float core=exp(-pow(d/(px*.85),2.));
  float glow=exp(-abs(d)/(px*5.))*.32+exp(-abs(d)/.02)*.05;
  col+=vec3(1.,.985,.96)*(core+glow)*prof*uArc;

  vec2 uv=gl_FragCoord.xy/uRes;
  col*=1.-.32*pow(length((uv-.5)*vec2(1.,1.15)),2.2)*1.6;
  col+=(h21(gl_FragCoord.xy+fract(uT*24.)*91.7)-.5)*.045;
  gl_FragColor=vec4(max(col,0.)*uFade, 1.);
}`;

// ---------------------------------------------------------------- timeline
const S = { BLACK:0, VINYL:1, MAP:2, CD:3, OCEAN:4, LEATHER:5, PAPER:6, TV:7, LEAF:8, PROT:9, COMPASS:10, SUN:11,
  WOOD:12, RINGS:13, REDDOME:14, MAGDOME:15, CYAN:16, LENS:17, PETRI:18, BUBBLES:19, EMBERS:20, CONCRETE:21,
  PINKCELLS:22, FOAM:23, FRINGE:24, AGAR:25, FIBRE:26, RED:27, EARTH:28, END:29, LEDGER:30, CRUST:31 };
const RAPID = [S.REDDOME, S.MAGDOME, S.CYAN, S.LENS, S.PETRI, S.BUBBLES, S.EMBERS, S.CONCRETE, S.PINKCELLS,
  S.FOAM, S.FRINGE, S.AGAR, S.FIBRE, S.LEDGER, S.CRUST, S.MAP, S.RINGS, S.LEATHER, S.CD, S.SUN];
const DUR = 30.05;
const SLOW = [ // the opening holds, cut where the original cuts
  [0, 1.0, S.BLACK], [1.0, 2.0, S.VINYL], [2.0, 3.2, S.MAP], [3.2, 4.2, S.CD], [4.2, 5.5, S.OCEAN],
  [5.5, 7.4, S.LEATHER], [7.4, 8.1, S.PAPER], [8.1, 9.0, S.TV], [9.0, 10.7, S.LEAF], [10.7, 11.0, S.PROT],
  [11.0, 11.4, S.COMPASS], [11.4, 11.7, S.SUN], [11.7, 12.2, S.WOOD], [12.2, 13.0, S.RINGS],
  [13.0, 13.5, S.BLACK], [13.5, 14.0, S.MAP],
];
let rnd = Math.random;
function buildTake() {
  const shots = SLOW.map(([a, b, sc]) => ({ a, b, sc, seed: sc === S.MAP && a > 13 ? 0.7 + rnd() * 0.3 : rnd() * 0.5 }));
  let t = 14.0, prev = [-1, -1];
  while (t < 23.5 - 1e-6) {
    let dur = rnd() < 0.72 ? 0.125 : 0.25;
    if (t + dur > 23.5) dur = 23.5 - t;
    let sc; do { sc = RAPID[Math.floor(rnd() * RAPID.length)]; } while (prev.includes(sc));
    prev = [prev[1], sc];
    shots.push({ a: t, b: t + dur, sc, seed: rnd() });
    t += dur;
  }
  shots.push({ a: 23.5, b: 24.0, sc: S.RED, seed: 0 }, { a: 24.0, b: 26.9, sc: S.EARTH, seed: 0 }, { a: 26.9, b: DUR + 1, sc: S.END, seed: 0 });
  return shots;
}
const fade = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
function look(t, shot) {
  let arc = 1, f = 1;
  if (t < 1.0) arc = fade(t, 0.05, 0.9);
  if (shot.sc === S.PAPER) arc = 0;
  if (shot.sc === S.RED) arc = 0.15;
  if (shot.sc === S.EARTH) { f = fade(t, 24.0, 24.35) * (1 - fade(t, 26.3, 26.9)); arc = 0.9; }
  if (shot.sc === S.END) { arc = fade(t, 27.2, 28.3) * (1 - fade(t, 29.6, 30.05)); }
  const hi = t < 13 ? -0.15 + 0.5 * Math.sin(t * 0.35) : t < 24 ? 0.25 * Math.sin(t * 0.9) : t < 27 ? -0.1 : 0.35;
  return { arc, f, hi };
}
function titles(t) {
  const main = t >= 13.0 && t < 23.5;
  const txt = t < 16.0 ? 'THE SAME' : t < 18.25 ? 'IS NEVER' : 'THE SAME.';
  const again = t >= 24.7 && t < 26.95 ? Math.min(fade(t, 24.7, 25.5), 1 - fade(t, 26.35, 26.9)) : 0;
  const end = t >= 27.9 ? fade(t, 27.9, 28.8) * (1 - fade(t, 29.7, 30.05)) : 0;
  return { main, txt, again, end };
}

// ---------------------------------------------------------------- sound
let ac = null, master = null, noiseBuf = null, muted = false;
function makeNoise() {
  const b = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function env(g, t, a, peak, dec) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); }
function noiseHit(t, type, freq, q, peak, dec, out) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = 0.8 + Math.random() * 0.4;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ac.createGain(); env(g, t, 0.002, peak, dec);
  s.connect(f).connect(g).connect(out); s.start(t, Math.random() * 0.5); s.stop(t + dec + 0.05);
}
function kick(t, out, peak = 0.9) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
  env(g, t, 0.003, peak, 0.42); o.connect(g).connect(out); o.start(t); o.stop(t + 0.5);
}
function tone(t, freq, type, peak, a, dec, out, cutoff = 2400) {
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  o.type = type; o.frequency.value = freq; f.type = 'lowpass'; f.frequency.value = cutoff;
  env(g, t, a, peak, dec); o.connect(f).connect(g).connect(out); o.start(t); o.stop(t + a + dec + 0.1);
}
function pad(t0, t1, freqs, peak, cutoff, out) {
  const g = ac.createGain(), f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff; f.Q.value = 0.6;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + Math.min(2.5, (t1 - t0) / 2));
  g.gain.setValueAtTime(peak, t1 - 1.2); g.gain.exponentialRampToValueAtTime(0.0001, t1);
  f.connect(g).connect(out);
  freqs.forEach((fr, i) => [-6, 6].forEach((det) => {
    const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.detune.value = det + i;
    o.connect(f); o.start(t0); o.stop(t1 + 0.1);
  }));
}
function schedule(t0, shots) {
  const out = master;
  const at = (x) => t0 + x;
  pad(at(0), at(13.6), [110, 164.8, 196, 246.9, 261.6], 0.035, 900, out);
  shots.filter((s) => s.a > 0.5 && s.a < 13.9).forEach((s) => {
    noiseHit(at(s.a), 'bandpass', 2400, 1.2, 0.18, 0.06, out);
    kick(at(s.a), out, 0.22);
  });
  for (let b = 0; b < 21; b++) { // 120 bpm from the drop at 13.0
    const t = 13.0 + b * 0.5; if (t >= 23.5) break;
    kick(at(t), out, b === 0 ? 1 : 0.85);
    if (b % 2 === 1) noiseHit(at(t), 'bandpass', 1400, 0.9, 0.32, 0.16, out);
    tone(at(t + 0.25), [55, 55, 65.4, 49][Math.floor(b / 4) % 4], 'sawtooth', 0.12, 0.005, 0.22, out, 500);
  }
  for (let x = 13.0; x < 23.49; x += 0.125) noiseHit(at(x), 'highpass', 8000, 0.7, (x * 8) % 2 < 1 ? 0.1 : 0.05, 0.04, out);
  pad(at(13.0), at(23.5), [220, 329.6, 392, 493.9], 0.018, 1600, out);
  noiseHit(at(23.5), 'lowpass', 5000, 0.5, 0.6, 0.5, out); kick(at(23.5), out, 1);
  pad(at(24.0), at(27.6), [174.6, 220, 261.6, 329.6, 392], 0.04, 2200, out);
  [[1318.5, 0.12], [2637, 0.03], [659.3, 0.07]].forEach(([fr, pk]) => tone(at(28.0), fr, 'sine', pk, 0.01, 2.6, out, 8000));
}

// ---------------------------------------------------------------- render
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl', { antialias: false, preserveDrawingBuffer: false });
const stage = document.getElementById('stage');
let U = {};
if (gl) {
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(pr); gl.useProgram(pr);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  ['uRes', 'uT', 'uLocal', 'uSeed', 'uArc', 'uFade', 'uHi', 'uScene'].forEach((n) => U[n] = gl.getUniformLocation(pr, n));
}

function fit() {
  const W = innerWidth, H = innerHeight;
  let w = W, h = W * 9 / 16; if (h > H) { h = H; w = H * 16 / 9; }
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  stage.style.setProperty('--u', (h / 100) + 'px');
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const scale = w * dpr > 2200 ? 2200 / (w * dpr) : 1;
  cv.width = Math.round(w * dpr * scale); cv.height = Math.round(h * dpr * scale);
  if (gl) gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener('resize', () => { fit(); if (!playing) draw(stillT); });

let shots = buildTake(), takeNo = 1, playing = false, started = false, t0 = 0, pausedAt = 0, stillT = 1.6;
const el = (id) => document.getElementById(id);
const tMain = el('t-main'), tText = el('t-text'), tAgain = el('t-again'), tEnd = el('t-end');

function shotAt(t) { for (let i = shots.length - 1; i >= 0; i--) if (t >= shots[i].a) return shots[i]; return shots[0]; }
function draw(t) {
  const sh = shotAt(t), lk = look(t, sh);
  if (gl) {
    gl.uniform2f(U.uRes, cv.width, cv.height); gl.uniform1f(U.uT, t); gl.uniform1f(U.uLocal, t - sh.a);
    gl.uniform1f(U.uSeed, sh.seed); gl.uniform1f(U.uArc, lk.arc); gl.uniform1f(U.uFade, lk.f); gl.uniform1f(U.uHi, lk.hi);
    gl.uniform1i(U.uScene, sh.sc); gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  const tt = started ? titles(t) : { main: false, again: 0, end: 0 };
  tMain.hidden = !tt.main; if (tt.main && tText.textContent !== tt.txt) tText.textContent = tt.txt;
  tAgain.hidden = tt.again <= 0; tAgain.style.opacity = tt.again;
  tEnd.hidden = tt.end <= 0; tEnd.style.opacity = tt.end;
}
const now = () => ac ? ac.currentTime : performance.now() / 1000;
function clock() { return playing ? now() - t0 : pausedAt; }
function fmt(t) { const s = Math.max(0, Math.min(t, 30)); return `00:${String(Math.floor(s)).padStart(2, '0')}`; }

function startTake(newCut) {
  if (newCut) { shots = buildTake(); takeNo++; }
  el('take').textContent = `Take ${String(takeNo).padStart(2, '0')}`;
  if (ac) {
    if (master) { const old = master; old.gain.setTargetAtTime(0, ac.currentTime, 0.03); setTimeout(() => old.disconnect(), 300); }
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(ac.destination);
    t0 = ac.currentTime + 0.08; schedule(t0, shots);
    if (ac.state === 'suspended') ac.resume();
  } else t0 = now();
  playing = true; started = true; setPP();
}
function setPP() {
  el('pp').setAttribute('aria-label', playing ? 'Pause' : 'Play');
  el('pp-ico').innerHTML = playing ? '<path d="M1 0h3v10H1zM6 0h3v10H6z"/>' : '<path d="M1 0l9 5-9 5z"/>';
}
el('play').addEventListener('click', () => {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); noiseBuf = noiseBuf || makeNoise(); } catch (e) { ac = null; }
  el('card').hidden = true; el('bar').hidden = false; startTake(false);
});
el('pp').addEventListener('click', () => {
  if (clock() >= DUR) { startTake(true); return; }
  if (playing) { pausedAt = clock(); playing = false; if (ac) ac.suspend(); }
  else { if (ac) { ac.resume(); } else t0 = now() - pausedAt; playing = true; }
  setPP();
});
el('again').addEventListener('click', () => startTake(true));
el('snd').addEventListener('click', () => {
  muted = !muted; el('snd').textContent = muted ? 'Sound off' : 'Sound on';
  el('snd').setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
  if (master) master.gain.setTargetAtTime(muted ? 0 : 0.8, ac.currentTime, 0.02);
});
document.addEventListener('keydown', (e) => { if (e.code === 'Space' && started) { e.preventDefault(); el('pp').click(); } });

let idleTimer = 0;
const bar = el('bar');
function wake() { bar.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (playing) bar.classList.add('idle'); }, 2200); }
stage.addEventListener('pointermove', wake); stage.addEventListener('pointerdown', wake);

function loop() {
  let t = started ? clock() : stillT;
  if (started && t >= DUR) { if (playing) { playing = false; pausedAt = DUR; setPP(); bar.classList.remove('idle'); } t = DUR - 0.01; }
  draw(t);
  if (started) { el('tc').textContent = fmt(t); el('prog').style.width = (Math.min(t, DUR) / DUR * 100) + '%'; }
  requestAnimationFrame(loop);
}
fit();
requestAnimationFrame(loop);
</script>
