<main><header><strong>STUDIO / MOVING PORTRAIT</strong><span>数字人 · 测试</span></header>
<article><figure id="frame"><video aria-label="数字人自我介绍短片" id="film" controls playsinline preload="metadata" poster="assets/portrait.png" src="assets/intro.mp4"></video><img id="original" src="assets/portrait.png" alt="黄熠的半写实数字肖像原稿"><figcaption><span>黄熠 · 动态肖像</span><span id="length">短片预览</span></figcaption></figure>
<section><div class="label">PORTRAIT IN MOTION / 02</div><h1>让这张脸，<br>开口说话。</h1><p>以黄熠的肖像为起点，尝试一个会开口说话的数字形象。<br>这是一段关于面容、动作与声音的早期实验。</p><div class="controls"><button class="primary" id="play">播放试片</button><button id="compare" aria-pressed="false">对照原稿</button></div><div id="status" role="status">点击播放，才会发出声音</div><p class="caption">“你好，我是工作室的数字讲解员。”</p><p class="note">本版为预先生成的视频样片，支持播放和原稿对照，暂不支持实时对话。</p><p class="note">配音使用合成男声，非本人声音克隆。</p></section></article>
<div class="foot"><span>数字人实验 · 2026.09</span><a href="../../work-test.html">← 返回测试</a></div></main>
<script>
const film=document.getElementById('film'),frame=document.getElementById('frame'),button=document.getElementById('play'),compare=document.getElementById('compare'),status=document.getElementById('status');
function original(on){frame.classList.toggle('compare',on);compare.setAttribute('aria-pressed',String(on));compare.textContent=on?'回到动态':'对照原稿';if(on)film.pause();}
button.onclick=async()=>{original(false);film.currentTime=0;try{await film.play()}catch{status.textContent='暂时无法播放，请点击视频内的播放按钮重试。'}};
compare.onclick=()=>original(compare.getAttribute('aria-pressed')!=='true');
film.onplay=()=>{button.textContent='从头播放';status.textContent='正在播放'};film.onpause=()=>{if(!film.ended)status.textContent='已暂停'};film.onended=()=>{button.textContent='再看一次';status.textContent='播放完毕 · 可切换原稿对照'};film.onloadedmetadata=()=>document.getElementById('length').textContent=film.duration.toFixed(2)+' 秒';film.onerror=()=>status.textContent='短片加载失败，请刷新重试。';document.addEventListener('visibilitychange',()=>{if(document.hidden)film.pause()});window.addEventListener('pagehide',()=>film.pause());
</script></html>
