<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Yi Huang 黄熠 — SUPPORT</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BPBFT1Q5SF"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-BPBFT1Q5SF');</script>
<link rel="preload" as="font" href="fonts/E.ttf" type="font/ttf" crossorigin>
<link rel="preload" as="font" href="fonts/Z-support.woff2" type="font/woff2" crossorigin>
<link rel="preload" as="font" href="fonts/Z-support-punc.woff2" type="font/woff2" crossorigin>
<link rel="preload" as="font" href="fonts/Z-support-cats.woff2" type="font/woff2" crossorigin>

<style>
  @font-face{font-family:"EFont";src:url("fonts/E.ttf") format("truetype");font-weight:400;font-style:normal;font-display:block;}
  @font-face{font-family:"EFont";src:url("fonts/E.ttf") format("truetype");font-weight:700;font-style:normal;font-display:block;}
  @font-face{font-family:"ZFont";src:url("fonts/Z-support.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block;}
  @font-face{font-family:"ZFont";src:url("fonts/Z-support.woff2") format("woff2");font-weight:700;font-style:normal;font-display:block;}
  @font-face{font-family:"ZFont";src:url("fonts/Z-support-punc.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block;unicode-range:U+300A,U+300B;}
  @font-face{font-family:"ZFont";src:url("fonts/Z-support-punc.woff2") format("woff2");font-weight:700;font-style:normal;font-display:block;unicode-range:U+300A,U+300B;}
  @font-face{font-family:"ZFont";src:url("fonts/Z-support-cats.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block;unicode-range:U+5B9E,U+4F53,U+827A,U+672F,U+54C1,U+5468,U+8FB9;}
  @font-face{font-family:"ZFont";src:url("fonts/Z-support-cats.woff2") format("woff2");font-weight:700;font-style:normal;font-display:block;unicode-range:U+5B9E,U+4F53,U+827A,U+672F,U+54C1,U+5468,U+8FB9;}

  html,body{height:100%;}
  body{
    margin:0;
    background:#ffffff;color:#111;
    font-family:"EFont","ZFont",sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  *{box-sizing:border-box;}

  /* ── 桌面导航 ── */
  .top-nav{
    position:fixed;top:22px;right:30px;z-index:2;
    display:flex;flex-direction:column;align-items:flex-end;gap:10px;
    font-size:28px;font-weight:700;letter-spacing:2.5px;
    font-family:"EFont","ZFont",sans-serif;
  }
  .top-nav a{color:#111;text-decoration:none;line-height:1;}
  .top-nav a:hover{text-decoration:underline;text-underline-offset:5px;}

  /* ── 移动端导航 ── */
  .mob-nav{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;justify-content:space-between;align-items:center;
    padding:0 22px;height:56px;
    background:#fff;border-bottom:1px solid #e8e8e8;
  }
  .mob-nav a{
    font-family:"EFont","ZFont",sans-serif;font-size:15px;font-weight:700;
    letter-spacing:1.5px;text-transform:uppercase;color:#aaa;text-decoration:none;
  }
  .mob-nav a.active{color:#111;}
  .mob-nav a:hover{color:#111;}
  @media(min-width:681px){.mob-nav{display:none;}}
  @media(max-width:680px){.top-nav{display:none;}}

  /* 分类入口：桌面和移动端共用内容 */
  .support-page{min-height:100vh;padding:72px 240px 72px 70px;}
  .page-title{
    font-family:"EFont","ZFont",sans-serif;
    font-size:23px;font-weight:700;letter-spacing:2.5px;margin:0 0 28px;
  }
  .cat-list{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;
    list-style:none;padding:0;margin:0;max-width:1120px;
  }
  .cat-item{min-width:0;}
  .cat-link{display:block;text-decoration:none;color:#111;}
  .cat-link img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;}
  .cat-info{padding:16px 0 0;}
  .cat-name-zh{font-family:"ZFont","EFont",sans-serif;font-size:20px;font-weight:700;display:block;}
  .cat-name-en{font-family:"EFont","ZFont",sans-serif;font-size:15px;font-weight:700;letter-spacing:0.5px;color:#888;display:block;margin-top:4px;}
  .cat-link:hover .cat-name-zh{text-decoration:underline;text-underline-offset:5px;}
  .cat-link:focus-visible{outline:2px solid #111;outline-offset:6px;}

  @media(min-width:681px) and (max-width:1100px){
    .support-page{padding:72px 210px 72px 32px;}
    .cat-list{grid-template-columns:1fr;gap:32px;}
    .cat-link{display:grid;grid-template-columns:minmax(160px,40%) minmax(0,1fr);align-items:center;gap:24px;}
    .cat-info{padding:0;}
  }
  @media(max-width:680px){
    .support-page{padding:0;}
    .page-title{display:none;}
    .cat-list{display:block;padding:56px 0 0;}
    .cat-item{border-bottom:1px solid #e8e8e8;}
    .cat-item:last-child{border-bottom:none;}
    .cat-info{padding:14px 20px 18px;}
    .cat-name-zh{font-size:18px;}
    .cat-name-en{font-size:13px;}
  }

</style>
</head>
<body>

<nav class="mob-nav">
  <a href="index.html">about</a>
  <a href="work.html">work</a>
  <a href="support.html" class="active">support</a>
</nav>

<nav class="top-nav" aria-label="Primary">
  <a href="index.html">ABOUT</a>
  <a href="work.html">WORK</a>
  <a href="news.html">NEWS</a>
  <a href="contact.html">CONTACT</a>
</nav>

<!-- 两端共用分类及商品页面 -->
<main class="support-page">
  <h1 class="page-title">SUPPORT</h1>
  <ul class="cat-list">
    <li class="cat-item">
      <a class="cat-link" href="support-film.html">
        <img src="images/cd1.png" alt="实体影像">
        <div class="cat-info">
          <span class="cat-name-zh">实体影像</span>
          <span class="cat-name-en">Physical Film</span>
        </div>
      </a>
    </li>
    <li class="cat-item">
      <a class="cat-link" href="support-artwork.html">
        <img src="images/artwork1.png" alt="艺术品">
        <div class="cat-info">
          <span class="cat-name-zh">艺术品</span>
          <span class="cat-name-en">Artwork</span>
        </div>
      </a>
    </li>
    <li class="cat-item">
      <a class="cat-link" href="support-merch.html">
        <img src="images/merch1.png" alt="周边">
        <div class="cat-info">
          <span class="cat-name-zh">周边</span>
          <span class="cat-name-en">Merchandise</span>
        </div>
      </a>
    </li>
  </ul>
</main>

</body>
</html>
