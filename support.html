<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Yi Huang 黄熠 — SUPPORT</title>
<!-- Google tag (gtag.js) -->

<style>
  @font-face{
    font-family:"EFont";
    src:url("fonts/E.ttf") format("truetype");
    font-weight:400;
    font-style:normal;
    font-display:block;
  }
  @font-face{
    font-family:"EFont";
    src:url("fonts/E.ttf") format("truetype");
    font-weight:700;
    font-style:normal;
    font-display:block;
  }
  @font-face{
    font-family:"ZFont";
    src:url("fonts/Z-work.woff2") format("woff2");
    font-weight:400;
    font-style:normal;
    font-display:block;
  }
  @font-face{
    font-family:"ZFont";
    src:url("fonts/Z-work.woff2") format("woff2");
    font-weight:700;
    font-style:normal;
    font-display:block;
  }

  html,body{height:100%;}
  body{
    margin:0;
    background:#ffffff;
    color:#111;
    font-family:"EFont","ZFont",sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .top-nav{
    position:fixed;
    top:22px;
    right:30px;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:10px;
    font-size:28px;
    font-weight:700;
    letter-spacing:2.5px;
    font-family:"EFont","ZFont",sans-serif;
  }
  .top-nav a{color:#111; text-decoration:none; line-height:1;}
  .top-nav a:hover{text-decoration:underline; text-underline-offset:5px;}

  .page{
    min-height:100vh;
    box-sizing:border-box;
    padding:72px 70px;
  }

  .page-title{
    font-size:28px;
    letter-spacing:2.5px;
    font-weight:700;
    margin:0 0 18px 0;
    font-family:"EFont","ZFont",sans-serif;
  }

  .group{
    margin:18px 0 36px 0;
    max-width:860px;
  }

  .group-head{
    margin:0 0 14px 0;
    line-height:1.2;
  }

  .category{
    display:block;
    font-family:"ZFont","EFont",sans-serif;
    font-size:23px;
    font-weight:700;
    color:#111;
    margin-bottom:2px;
  }

  .category-en{
    display:block;
    font-family:"EFont","ZFont",sans-serif;
    font-size:17px;
    font-weight:700;
    color:#2a2a2a;
    margin-bottom:14px;
  }

  /* 商品列表 */
  .list{
    list-style:none;
    padding:0;
    margin:0;
  }

  .item{
    display:flex;
    gap:16px;
    align-items:baseline;
    margin:10px 0;
  }

  .item-name{
    font-family:"EFont","ZFont",sans-serif;
    font-weight:700;
    font-size:20px;
    color:#111;
    flex:1;
  }

  .item-price{
    font-family:"EFont","ZFont",sans-serif;
    font-weight:400;
    font-size:18px;
    color:#555;
    white-space:nowrap;
  }

  .buy-btn{
    display:inline-block;
    font-family:"EFont","ZFont",sans-serif;
    font-size:14px;
    font-weight:700;
    letter-spacing:1.5px;
    color:#fff;
    background:#111;
    padding:6px 16px;
    text-decoration:none;
    white-space:nowrap;
  }
  .buy-btn:hover{background:#444;}

  @media(max-width:860px){
    .page{padding:70px 22px;}
    .top-nav{font-size:22px; letter-spacing:2px; right:18px; top:18px; gap:8px;}
    .page-title{font-size:24px;}
    .category{font-size:18px;}
    .item-name{font-size:17px;}
    .item-price{font-size:15px;}
  }
</style>
</head>

<body>

<nav class="top-nav" aria-label="Primary">
  <a href="index.html">ABOUT</a>
  <a href="work.html">WORK</a>
  <a href="contact.html">CONTACT</a>
  <a href="news.html">AUTOMATIC</a>
</nav>

<main class="page">
  <h1 class="page-title">SUPPORT</h1>

  <!-- 影像CD -->
  <section class="group">
    <h2 class="group-head">
      <span class="category">影像CD</span>
      <span class="category-en">Video CD</span>
    </h2>
    <ul class="list">
      <li class="item">
        <span class="item-name">作品名称 / Title</span>
        <span class="item-price">£__</span>
        <a class="buy-btn" href="#" target="_blank">BUY</a>
      </li>
    </ul>
  </section>

  <!-- 书籍 -->
  <section class="group">
    <h2 class="group-head">
      <span class="category">书籍</span>
      <span class="category-en">Books</span>
    </h2>
    <ul class="list">
      <li class="item">
        <span class="item-name">书名 / Title</span>
        <span class="item-price">£__</span>
        <a class="buy-btn" href="#" target="_blank">BUY</a>
      </li>
    </ul>
  </section>

</main>
</body>
</html>
