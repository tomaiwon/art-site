<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f1e8d4" />
    <meta
      name="description"
      content="东亚制造 — East Asia Manufacturing，黄熠的艺术项目。"
    />
    <title>东亚制造 — Yi Huang 黄熠</title>
    <link rel="canonical" href="https://yihuang.art/east-asia/" />
    <style>
      html,
      body {
        margin: 0;
        background: #f1e8d4;
      }
      /* First paint stays paper-only, even before the external CSS arrives. */
      body[data-cover-state] .atlas-stage {
        opacity: 0;
        pointer-events: none;
      }
      body #cover-title .cover-title-zh {
        clip-path: inset(50%);
      }
    </style>
    <link
      rel="stylesheet"
      href="./cover.css?v=4bd082bb7b8b"
      onerror="
        document.documentElement.dataset.coverCssFailed = 'true';
        window.__eamCoverBoot?.fail();
      "
    />
  </head>
  <body
    class="observatory"
    data-cover="true"
    data-cover-title="sculpture"
    data-cover-state="loading"
  >
    <a class="skip-link" href="../effects/">跳到项目内容</a>
    <main class="atlas-panel">
      <div class="atlas-stage">
        <iframe
          id="atlas-frame"
          title="东亚制造：点墨地球与立体字块"
          src="./frame.html?v=3d36892b9331"
          inert
        ></iframe>
        <div class="atlas-cover">
          <div class="cover-copy">
            <h1 id="cover-title">
              <span class="cover-title-zh" lang="zh-CN">东亚制造</span>
            </h1>
            <button class="cover-enter" type="button" disabled inert>
              正在进行中
            </button>
          </div>
        </div>
      </div>
      <p class="cover-error" id="cover-error" role="status" hidden>
        三维视觉暂未能载入。<a href="../effects/">继续查看项目</a>
      </p>
      <noscript
        ><p class="cover-error">
          动态视觉需要 JavaScript。<a href="../effects/">继续查看项目</a>
        </p></noscript
      >
    </main>
    <script>
      // Independent of the module: a blocked/failed entry script must not leave
      // an endless blank page. Loading in a background tab is not a failure.
      (() => {
        let timer;
        let suspended = false;
        const page = document.body;
        const frame = document.getElementById("atlas-frame");
        const entry = document.querySelector(".cover-enter");
        const error = document.getElementById("cover-error");
        function state(value) {
          window.clearTimeout(timer);
          if (document.documentElement.dataset.coverCssFailed === "true")
            value = "failed";
          page.dataset.coverState = value;
          frame.toggleAttribute("inert", value !== "ready");
          entry.toggleAttribute("inert", value !== "ready");
          error.hidden = value !== "failed";
          if (value === "loading" && !document.hidden && !suspended)
            timer = window.setTimeout(() => state("failed"), 20000);
        }
        window.__eamCoverBoot = {
          loading: () => state("loading"),
          ready: () => state("ready"),
          fail: () => state("failed"),
        };
        document.addEventListener("visibilitychange", () => {
          if (page.dataset.coverState === "loading") state("loading");
        });
        window.addEventListener("pagehide", () => {
          suspended = true;
          state("loading");
        });
        window.addEventListener("pageshow", (event) => {
          suspended = false;
          if (event.persisted) state("loading");
        });
        state("loading");
      })();
    </script>
    <script
      type="module"
      src="./entry.js?v=fa03d13926d7"
      onerror="window.__eamCoverBoot.fail()"
    ></script>
  </body>
</html>
